# LMStudio (port 1234) — the whole config for this engine.
#
# ONE ENGINE RUNS AT A TIME. `GATEWAY_ENGINE=lms` in .env points compose at THIS file, and
# the aliases below are then the entire vocabulary the gateway serves. To serve a different
# engine, change that word and `docker compose up -d` again.
#
# THIS FILE IS SELF-CONTAINED. It includes settings.yaml for the three settings blocks and
# declares its own aliases. There is no fragment/composed split and no generated config —
# what you read here is what LiteLLM loads.
#
# THREE THINGS ABOUT LMSTUDIO, and the first one causes most "the gateway is broken" reports:
#
#   IT MUST BE HAND-LOADED. LMStudio JIT-loads a model that is not resident, and a JIT load
#   does NOT inherit hand-load flags — the model comes back at 8192 context with a 1 h TTL,
#   so max_input_tokens below becomes a lie and a long prompt fails for no visible reason.
#   A session that worked this morning fails this afternoon with nothing changed.
#   `lms ps --json` is the truth, not the UI:
#
#     lms load google/gemma-4-e4b        --context-length 131072 --parallel 1 --gpu max
#     lms load google/gemma-4-26b-a4b-qat --context-length 262144 --parallel 1 --gpu max
#     lms load qwen/qwen3.8-27b           --context-length 262144 --parallel 1 --gpu max
#
#   `--parallel 1` IS DELIBERATE and is the flag most likely to be "improved" wrongly. An
#   agent client fires its main turn and its background calls at once; at --parallel 4 they
#   split one GPU four ways and everything slows together — a 1-token request measured 34 s
#   while large prompts sat in front of it.
#
#   THE KEY IS ANY STRING. LMStudio never checks it, unlike Unsloth.

include:
  - settings.yaml

model_list:
  # Gemma 4 E4B — "effective" 4B, the small chat route. Its window is 131072, not the 262144
  # the larger Gemma builds carry, which is where the 122880 below comes from. Tools AND
  # vision both work: small here means few parameters, not a cut-down feature set, which is
  # why tests/ defaults to this row.
  - model_name: lms-gemma4-e4b
    litellm_params:
      model: lm_studio/google/gemma-4-e4b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"              # LMStudio accepts any string
      input_cost_per_token: 0.00000012    # shadow price, so budget ceilings still trip
      output_cost_per_token: 0.00000035
      max_tokens: 4096                    # IT REASONS — 65 of 70 completion tokens on a
                                          # one-word prompt, 2026-08-28. 4096 clears that
                                          # comfortably; 20 returned empty content
      timeout: 3600                       # see the timeout note in settings.yaml
    model_info:
      max_input_tokens: 122880            # 131072 − the 8192 output reserve
      max_output_tokens: 8192

  # Gemma 4 26B A4B QAT — the large chat route, and the flagship local model. A 26B mixture
  # of experts with ~4B active per token, so it answers at roughly small-model speed while
  # holding a large model's knowledge.
  #
  # QAT means quantisation-aware trained, not quantised after the fact: the 4-bit error is
  # learned around during training, so this sits closer to full precision than its label
  # suggests. `unsloth-gemma4-26b`, `ollama-gemma4-26b` and `openrouter-gemma4-26b` are the
  # same weights on other engines — change GATEWAY_ENGINE and re-run tests/ to compare them.
  #
  # It does NOT emit a reasoning block, while `unsloth-gemma4-26b` on the identical weights
  # does (verified 2026-08-27). Thinking is decided per MODEL AND ENGINE, so never assume.
  - model_name: lms-gemma4-26b
    litellm_params:
      model: lm_studio/google/gemma-4-26b-a4b-qat
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 4096                    # a default, not a cap; guards runaway generations
      timeout: 3600
    model_info:
      max_input_tokens: 253952            # 262144 − the 8192 output reserve
      max_output_tokens: 8192

  # Qwen 3.8 27B, the MLX 4-bit build — a DENSE 27B, so every token runs all 27B weights and
  # it answers slower than the 26B MoE above. Chat, tools and vision (`lms ls --json`).
  # `unsloth-qwen38-27b`, `openrouter-qwen38-27b` and `cerebras-qwen38-27b` are the same
  # model on other engines.
  #
  # IT THINKS BEFORE IT ANSWERS, and the thinking spends max_tokens first: on the Q8 build of
  # the same model, max_tokens 128 came back EMPTY with finish_reason `length` and 2048
  # answered in 242 tokens (measured 2026-09-08). Hence 8192, not the 4096 above.
  #
  # SHADOW PRICE: DeepInfra's unquantised bf16 rate for these weights on OpenRouter, $0.15 /
  # $1.875 per 1M (2026-09-29) — the cloud twin's rate, so a budget ceiling still trips.
  - model_name: lms-qwen38-27b
    litellm_params:
      # WHY:        `openai/`, NOT `lm_studio/` like every other alias here, and only because
      #             of the `allowed_openai_params` line below. Codex sends
      #             `reasoning: {effort, summary}` on /v1/responses. `lm_studio/` has no native
      #             Responses config, so LiteLLM turns the call into a chat call and — because
      #             `summary` is set — passes the WHOLE OBJECT as `reasoning_effort`
      #             (litellm/responses/litellm_completion_transformation/transformation.py,
      #             main-stable 2026-09-30). Once the line below let it through, LMStudio
      #             answered `400 'reasoning_effort' must be a string` and Codex failed in
      #             0.5 s. `openai/` HAS a native Responses config, so the call reaches
      #             LMStudio's own /v1/responses untouched, which takes the object and applies
      #             the level: 54 prompt tokens at `xhigh`, 12 at `medium` (2026-09-30, direct).
      #             `unsloth-qwen38-27b` was already `openai/`, and Codex passed there.
      # SCOPE:      provider=openai→LMStudio  route=/v1/responses  client=6_codex_sdk
      # PROVEN:     2026-09-30, tests/run_cache.py codex × lms-qwen38-27b: fail on `lm_studio/`
      #             with the line below, pass on `openai/`
      # GUARDED BY: tests/6_codex_sdk/02_session.py --model lms-qwen38-27b
      # TRIED AND REJECTED: a second deployment for /v1/responses only — LiteLLM's router
      #             does not filter deployments by `model_info.supported_endpoints`, so it would
      #             load-balance Codex onto the chat one at random. Dropping the line below —
      #             that puts every caller back on `xhigh`.
      model: openai/qwen/qwen3.8-27b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.000001875
      max_tokens: 8192
      timeout: 3600
      # WHY:        LiteLLM's `lm_studio/` provider does not list `reasoning_effort`, so
      #             `drop_params: true` (settings.yaml) DELETED it and Qwen's template ran its
      #             own default, `xhigh`, for every caller — Claude Code's `output_config.effort`
      #             included, which LiteLLM maps to this same field. The template writes the
      #             level into the top of the system prompt, which is how to see it: one system
      #             + user message, `max_tokens: 1`, 62 prompt tokens at `xhigh` and 24 at
      #             `medium` on LMStudio direct, but 62 and 62 through this route (2026-09-30).
      #             `xhigh` is not a small cost: one agent step took 693 s and answered NOTHING,
      #             `medium` 231 s (2026-09-30, straight to LMStudio).
      #             Values, the same direct and through this route (2026-09-30, `openai/`):
      #             LMStudio runs `high` as `xhigh` and `minimal` as `low`, and answers `max`
      #             with a 400; `none` turns thinking off.
      # SCOPE:      provider=openai→LMStudio (see `model:` above)  route=/v1/chat/completions,
      #             and /v1/messages, which LiteLLM turns into it. /v1/responses goes native
      #             and needs no allowance  client=every tests/ folder but 6_codex_sdk
      # PROVEN:     see GUARDED BY — red without this line (2026-09-30, on `lm_studio/` here and
      #             on Unsloth's `openai/` route), green with it on `openai/` (the whole suite
      #             7/7 at `medium`, 2026-09-30)
      # GUARDED BY: tests/2_openai_client/05_reasoning_effort.py --model lms-qwen38-27b
      # KEEP IT on any new or renamed LMStudio Qwen alias, and on the copy in lukas.yaml.
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      max_input_tokens: 253952            # 262144 − the 8192 output reserve
      max_output_tokens: 8192

  # nomic-embed-text v1.5 at 768 dimensions, the Q4_K_M build at 84 MB. It loads in under a
  # second and needs none of the hand-load care the chat routes do.
  #
  # EMBEDDING VECTORS DO NOT MIX ACROSS MODELS OR BUILDS. Every engine here serves the same
  # nomic v1.5 at 768 dims in a DIFFERENT build — this is Q4_K_M, `unsloth-nomic-embed` is Q8_0,
  # `ollama-nomic-embed` is F16 (measured 2026-08-31, `lms ls --json` and `ollama show`), and
  # `openai-embed3-small` is a different model at 1536 dims entirely. Quantisation moves where a
  # text lands in the space, so an index built with one alias and queried with another
  # returns quietly worse neighbours and never errors. Record which alias built each index.
  - model_name: lms-nomic-embed
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048
