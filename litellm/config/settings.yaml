# LiteLLM gateway — THE SETTINGS, and the notes that are true of every alias.
#
# NO ALIAS LIVES HERE. This file carries the three settings blocks and the MCP servers behind
# the gateway, and nothing else, and each engine config includes it exactly once. The aliases
# live one file per engine, and an engine is an engine whether its GPU is yours or someone
# else's:
#
#   lms.yaml   unsloth.yaml   ollama.yaml            this machine, free
#   openrouter.yaml   openai.yaml                    the cloud, PAID
#
# HOW A CONFIG IS BUILT — and it barely is. compose mounts this whole directory at
# /app/config and points LiteLLM at ONE file, named by ONE word in `.env`:
#
#   --config /app/config/${GATEWAY_ENGINE:-lms}.yaml
#
# Each of those five files carries `include: [settings.yaml]` and then its own `model_list`.
# LiteLLM merges an included file key by key: a LIST is extended, anything else is replaced.
# So the settings blocks below arrive from here and the aliases from there, in one file the
# reader can follow top to bottom.
#
# ONE ENGINE RUNS AT A TIME, ON PURPOSE. There is no list, no `all`, and no starter/full
# split. Until 2026-08-31 there were eight composed `config.<models>.<engine>.yaml` files and
# then a generator script; both are gone, and the whole selection mechanism is now the
# filename above. To compare two engines, change the word and `up -d` again.
#
# NOTHING INCLUDED MAY ITSELF CARRY AN `include:`. LiteLLM does not recurse: a nested
# `include:` is merged as data and then deleted, so the settings would silently vanish and
# the proxy would boot with NO master key.
#
# ---------------------------------------------------------------------------------
# THE OTHER GATEWAY HAS ITS OWN LIST AND DOES NOT READ ANY OF THIS. Envoy's routes live in
# envoy/config/<engine>.yaml — Kubernetes custom resources, a different shape entirely. So AN
# ALIAS IS TWO EDITS, one per gateway. Add it on one side only and the name answers on 24000
# and 404s on 26000, with nothing in either log to say why.
#
# ADDING A MODEL is a FIVE-part edit, and skipping any part is a bug that hides:
#   1. the model_list entry, in the file for ITS engine
#   2. its price — an unpriced route logs $0, which makes a budget ceiling a no-op
#   3. its max_input_tokens — with enable_pre_call_checks on, this is what catches an
#      over-long prompt before it reaches the model
#   4. THE MATCHING AIGatewayRoute rule in envoy/config/<engine>.yaml — the other gateway's
#      list: an exact x-ai-eg-model match, a modelNameOverride, and a request timeout
#   5. the alias table in README.md — a route nobody documents is a route nobody calls
#
# EVERY ALIAS NAMES ITS ENGINE. `lms-*` is LMStudio, `unsloth-*` is Unsloth Studio,
# `ollama-*` is Ollama, `openrouter-*` is OpenRouter, `openai-*` is OpenAI. There is
# deliberately no engine-neutral name and no capability name: `local` existed and hid which
# engine answered; `cheap`, `standard` and `frontier` existed and hid who was BILLED. Both
# were removed for the same reason. Keep the convention when you add one.
#
# THE PREFIX IS ALSO THE MONEY WARNING. The first three are this machine and are free; the
# last two are someone else's datacentre and bill a real account. No alias crosses that line
# by itself — there are no fallback chains — so a request only ever costs money when a
# caller names a route that costs money.
#
# ---------------------------------------------------------------------------------
# THREE FACTS THAT APPLY TO EVERY ENGINE FILE, so they are written here once.
#
# 1. THE 3600 s TIMEOUT ON EVERY CHAT ROUTE. Prompt processing on this machine measures
#    ~100 tok/s (17.6k tokens in 173 s), so an agent-scale prompt needs 5-15 MINUTES before
#    its first token and a full 253952-token window needs ~42. LiteLLM's 600 s default
#    expires mid-prompt; LMStudio then reports `Engine protocol predict request failed:
#    fetch failed` — its engine socket torn down, not a bad request — which maps to a 400,
#    and a 400 is never retried. Raise it in step with the client's own timeout
#    (API_TIMEOUT_MS for Claude Code), or the client gives up first and the patience is
#    wasted. Hosted routes keep the default: an hour is right for a local GPU grinding and
#    wrong for a hung HTTP call to OpenRouter.
#
# 2. PRICES ARE STATED EXPLICITLY, because LiteLLM's cost map knows none of these models and
#    an unpriced route logs $0 — which makes a virtual key's budget ceiling a no-op. Local
#    routes are therefore SHADOW-PRICED: free to run, carrying a cloud twin's rate so a
#    ceiling still trips. Anything summing /spend/logs must say whether it reports money
#    billed or the cost of the same workload on the cloud twin.
#
#    Several local routes have no hosted twin to mirror, so their shadow price reuses the
#    nearest rate that IS sourced, rounded UP rather than down. A shadow price exists only
#    to make ceilings trip: pricing a 3B at a 26B's rate burns a budget faster than reality,
#    which is visible and correctable, while pricing it under reality silently disables the
#    guardrail. Err in the direction you can see.
#
# 3. REASONING TOKENS COME OUT OF max_tokens, AND WHICH ROUTES THINK IS DECIDED PER MODEL,
#    NOT PER ENGINE. A route that hits the cap mid-thought returns EMPTY content with
#    finish_reason "length" and raises no error at all. Two measurements that refuse the
#    tidy story that only Unsloth and Ollama think:
#      - 2026-08-28, `lms-gemma4-e4b` on LMSTUDIO: 65 of 70 completion tokens were reasoning, and at
#        max_tokens 20 the content came back empty.
#      - 2026-08-27, `lms-gemma4-26b` on LMStudio: NO reasoning block, while
#        `unsloth-gemma4-26b` — the identical gemma-4-26b-a4b-qat — produced one.
#    Treat EVERY chat route as capable of thinking and keep max_tokens generous.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
# ---------------------------------------------------------------------------------

litellm_settings:
  success_callback: []                    # tracing is a project's job, not the gateway's
  drop_params: true                       # forward what the model understands, drop the rest
  turn_off_message_logging: false         # pinned: either one flipped empties every stored request
  redact_messages_in_exceptions: false

  # EVERY SETTING BELOW THIS LINE CARRIES THE FOUR-FIELD HEADER, and the convention is in
  # ../../.claude/rules/05-implement.md § Settings that exist for one client. The short
  # version: a setting whose reason is not written down, and whose removal breaks no test,
  # WILL be removed by someone making a different client pass — and then rediscovered.
  # `GUARDED BY` is the field that prevents that. It is not optional.

  # WHY:            without it the Claude Agent SDK gets NO thinking blocks from any
  #                 `openai/`-provider alias — 0 runs out of 5, measured on unsloth-gemma4-e4b
  # SCOPE:          provider=openai/  route=/v1/messages  client=5_claude_agent_sdk
  # GLOBAL BECAUSE: litellm/__init__.py:239 declares it as a module bool and
  #                 llms/anthropic/experimental_pass_through/messages/handler.py:78 reads
  #                 that global. There is NO per-model, per-alias or per-request override —
  #                 checked across the whole package on 2026-09-05, three occurrences total.
  # PROVEN:         2026-09-05, litellm 1.99.1, unsloth-gemma4-e4b — 6/6 streaming and 4/5
  #                 non-streaming carried thinking, against 0/5 before
  # GUARDED BY:     tests/5_claude_agent_sdk/07_thinking.py — it asserts
  #                 THINKING_REACHES_CLIENT, so deleting this line turns the ollama and
  #                 unsloth rows red on the next suite run
  #
  # WHAT IT ACTUALLY DOES. `/v1/messages` picks its upstream route by PROVIDER, from one
  # frozen set in that same handler:
  #
  #     _RESPONSES_API_PROVIDERS: Final = frozenset({"openai"})
  #
  # A provider in that set is bridged through the RESPONSES API instead of chat completions,
  # and that bridge does not carry `reasoning_content`. Our aliases split exactly on it —
  # `lms-*` is `lm_studio/` and `openrouter-*` is `openrouter/`, so neither was ever
  # affected; `ollama-*`, `unsloth-*` and `openai-*` are `openai/` and were. That is the
  # whole reason the bug looked engine-specific when it is provider-specific.
  #
  # This forces the chat-completions path, where the adapter already falls back to
  # `reasoning_content` when `thinking_blocks` is absent (adapters/transformation.py, the
  # `elif` at line 1245). That fallback was proven correct in isolation BEFORE the flag was
  # found, which is how the search narrowed to routing rather than translation.
  #
  # IT IS NOT THE ISSUES THAT WERE CLOSED. BerriAI/litellm#29518 and #27946 had both closed
  # before any of this was measured and NEITHER fixes it — #29518's fix already shipped in
  # 1.95.0, where the bug still reproduced. Upgrading 1.95.0 -> 1.99.1 changed nothing on
  # its own. Do not read their closure as the cure.
  #
  # TRIED AND REJECTED, so nobody re-tries them: `supports_reasoning: true` on the
  # deployment (0/3, no effect) and a plain image upgrade (0/5, no effect).
  #
  # IF A CLIENT EVER NEEDS THE OPPOSITE, do not flip this line. Give that alias its own
  # route with `model_info.supported_endpoints: ["/v1/messages"]`, which IS per-alias
  # (handler.py:87) — the same shape as Envoy's `<alias>-anthropic` aliases. Then record
  # both directions in ../README.md § Provider x route.
  use_chat_completions_url_for_anthropic_messages: true

  # NO ALIAS HAS A FALLBACK CHAIN, on either gateway, and there is no commented-out one to
  # uncomment. An alias names ONE route. That is the whole promise of the naming scheme: a
  # `lms-*` name means these weights, this engine, on this machine, free, and an
  # `openrouter-*` or `openai-*` name means someone is being billed. A chain breaks the
  # promise at the worst possible moment — a stopped LMStudio would silently turn a free
  # session into a paid one, with a correct-looking answer and nothing in the reply to say
  # the request left the building.
  #
  # THE OLD CHAIN IS WORTH KNOWING ABOUT because it is the obvious thing to add back. It was
  # `lms-gemma4-26b -> cheap-free -> cheap`, and it was removed on 2026-08-31 along with the tier
  # names it pointed at. If you do add one: budget every key that can reach it, and read
  # `api_base` in /spend/logs to find out after the fact where a request actually ran.
  #
  # ENVOY CAN EXPRESS A CHAIN AND EXPRESSES NONE, matching this file. Add a chain here
  # without adding the matching one there and the two gateways behave differently under
  # exactly the failure a chain exists to survive.

router_settings:
  enable_pre_call_checks: true            # off (the default), every max_input_tokens is inert

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Needs DATABASE_URL. The prompt lands in the `proxy_server_request` column, NOT in
  # `messages` — that one looks obvious and stays "{}" for chat completions.
  store_prompts_in_spend_logs: true

# ---------------------------------------------------------------------------------
# THE MCP SERVERS BEHIND THIS GATEWAY. A caller connects to ONE endpoint, /mcp on 24000, and
# gets the tools of every server below that its key may use, each renamed `<server>-<tool>`.
# The caller never learns where a server runs, so moving one changes nothing that calls the
# gateway. The key is sent as `x-litellm-api-key` — the header LiteLLM always reads as its
# own credential on /mcp (auth/user_api_key_auth_mcp.py:416).
#
# HERE AND NOT IN AN ENGINE FILE, because a tool server is not an engine. Every config
# includes this file, `all` and `lukas` too, so /mcp answers whatever GATEWAY_ENGINE says.
#
# A SERVER THAT IS DOWN COSTS NOTHING. LiteLLM 1.99.1 lists each server's tools at startup
# and on every client request, and a failure is a WARNING that skips that server and keeps
# the rest (mcp_server_manager.py:3261 and :5856). So /mcp works while `bench_hardware` is
# down, which is most of the time: `tools: []`, with `_meta` naming it `unreachable`
# (measured 2026-10-07). Envoy answers the same moment with a 500.
#
# WHY:            proves the MCP gateway end to end: an agent is given /mcp on 24000 and no
#                 other address, and still calls a tool on a server it never saw
# SCOPE:          route=/mcp  client=tests/3..7, each folder's gateway-MCP scenario
# PROVEN:         2026-10-07, litellm 1.99.1, `lms-gemma4-e4b`: folders 3, 4, 5 and 7 called
#                 `bench_hardware-bench_serial` through /mcp and answered SN-4417-QX, in
#                 3-12 s. Folder 6 listed the tools and did not call them
#                 (openai/codex#19871, `unsloth-gemma4-26b`). With no client, 60 s brought
#                 no listing to the server; two client listings both reached it
# GUARDED BY:     tests/4_deepagents/08_gateway_mcp.py, and the same scenario in folders
#                 3, 5, 6 and 7. Delete this block and every one of them goes red
#
# `bench_hardware` IS THE TEST SERVER, AND IT RUNS ONLY WHILE A TEST RUNS. Each agent folder
# starts its own `mcp_server.py --http 24090` for that one scenario and stops it after. Its
# two tools return fixed strings.
#
# host.containers.internal, NOT localhost: the server binds 127.0.0.1 on the HOST and this
# proxy runs in a container — the same way it reaches the three engines.
#
# allow_all_keys: true BECAUSE A CONFIG SERVER IS OTHERWISE INVISIBLE to every key but the
# master key and the keys granted it (get_allowed_mcp_servers, mcp_server_manager.py:2937),
# and the tests call with a virtual key. A REAL server with side effects must not carry it:
# grant that one per key or per team.
#
# THE NAME HAS NO HYPHEN, AND CANNOT: `-` is the separator LiteLLM puts between server and
# tool (MCP_TOOL_PREFIX_SEPARATOR, utils.py:53), and a name containing it is rejected.
mcp_servers:
  bench_hardware:
    url: http://host.containers.internal:24090/mcp
    transport: http
    allow_all_keys: true

# ---------------------------------------------------------------------------------
# THE HOSTED TIERS USED TO BE COMMENTED OUT HERE. They became real engine configs on
# 2026-08-31 — openrouter.yaml and openai.yaml, beside this file.
#
# WHY THEY MOVED: they lived beside the settings because they "belonged to no engine".
# That was true only while an engine meant a local one. OpenRouter and OpenAI ARE
# engines — GATEWAY_ENGINE names them like it names `lms`, and the alias prefix says
# which is which — so there is no cloud/local switch, and no `hosted.yaml` sitting
# outside the scheme that every other route follows.
#
# THE OLD NAMES WENT WITH THEM. `cheap`, `standard`, `frontier`, `cheap-free` and
# `standard-hf` named a tier rather than a vendor, so a caller could not tell who
# answered, who was billed, or that `cheap` was not the free one. `standard-hf` is gone
# entirely: HuggingFace only ever existed as a fallback target, and nothing has a
# fallback now.
#
# WHAT STILL LIVES IN THIS FILE: the three settings blocks and the MCP servers above, and
# nothing else. Every alias — local or hosted, free or billed — is in `<engine>.yaml` beside
# this file.
# ---------------------------------------------------------------------------------
