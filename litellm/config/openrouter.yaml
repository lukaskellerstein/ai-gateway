# OpenRouter — the whole config for this engine. IT SPENDS REAL MONEY.
#
# ONE ENGINE RUNS AT A TIME. `GATEWAY_ENGINE=openrouter` in .env points compose at THIS file,
# and the aliases below are then the entire vocabulary the gateway serves. Choosing this word
# is the act that makes spend possible — with `lms`, `unsloth` or `ollama` selected instead,
# nothing in the running gateway can bill anyone.
#
# THIS FILE IS SELF-CONTAINED: it includes settings.yaml for the three settings blocks and
# declares its own aliases.
#
# THE ENGINE IS IN THE NAME, exactly as it is for the three local ones. `openrouter-gemma4-26b` says
# who answers and therefore who bills you. There is no capability name — `cheap` and
# `standard` existed here until 2026-08-31 and were renamed for that reason: a caller reading
# `cheap` cannot tell it is not free.
#
# IT NEEDS A KEY, and the key is personal, so it arrives from the shell and the line in .env
# stays blank. With no key LiteLLM keeps the alias and answers 401 at call time, and the Envoy
# gateway on 26000 does the same. Nothing complains while either gateway boots.
#
# OPENROUTER IS A BROKER, NOT A MODEL HOST. One model id is served by several upstream
# providers and OpenRouter load-balances between them, so two calls to one alias can run on
# two different backends with different tokenisers, different tool support and different
# quirks. `require_parameters: true` drops any provider that cannot honour the parameters
# sent — in practice, the ones that would silently ignore `tools`. It also means the BUILD is
# never pinned: OpenRouter does not say which quantisation an upstream provider serves, so
# `openrouter-gemma4-26b` against `lms-gemma4-26b` is never a clean build-for-build comparison.

include:
  - settings.yaml

model_list:
  # Gemma 4 26B A4B — the same weights `lms-gemma4-26b`, `unsloth-gemma4-26b` and
  # `ollama-gemma4-26b` run locally, so this is the cloud half of the comparison those aliases
  # make: the same model, on hardware you do not own and do not have to keep loaded.
  #
  # $0.07 in / $0.34 out per 1M tokens, read from GET /api/v1/models on 2026-08-31. Those are
  # REAL prices, not the shadow prices the local routes carry: a budget ceiling on a key
  # holding this alias is protecting actual money.
  - model_name: openrouter-gemma4-26b
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000007   # $0.07 / 1M, live figure 2026-08-31
      output_cost_per_token: 0.00000034  # $0.34 / 1M
      max_tokens: 4096                   # it reasons — see note 3 in settings.yaml
      timeout: 600                       # NOT the 3600 the local routes use: a hosted
                                         # provider silent for 10 minutes is broken, not
                                         # busy loading 20 GB from disk
      extra_body:
        provider:
          require_parameters: true       # drop providers that cannot honour `tools`
      # WHY:            `parallel_tool_calls` + `require_parameters` above is a 404. Codex
      #                 sends the parameter on every call; NO OpenRouter provider for these
      #                 weights supports it; and `require_parameters` turns "cannot honour
      #                 it" into a hard refusal instead of dropping it. Measured directly
      #                 against OpenRouter 2026-09-05 — each alone is 200, together 404
      #                 "No endpoints found that can handle the requested parameters".
      # SCOPE:          provider=openrouter/  route=/v1/responses  client=6_codex_sdk
      # PER-ALIAS, NOT GLOBAL: a litellm_param on this deployment, so nothing else changes.
      #                 It KEEPS the pin above rather than weakening it — the pin is what
      #                 stops a provider returning tool calls as raw text, and dropping one
      #                 unsupported parameter is the smaller price.
      # PROVEN:         2026-09-05, openrouter-gemma4-26b, 6_codex_sdk
      # GUARDED BY:     tests/6_codex_sdk — all four scenarios fail without it
      #
      # THE SYMPTOM LIES, so read this before diagnosing. The 404 puts the deployment in the
      # router's COOLDOWN list, and every call for the next few seconds returns
      # `429 Too Many Requests — No deployments available`. That reads as an OpenRouter rate
      # limit and is not one; the real error appears in the FIRST failure only.
      additional_drop_params: ["parallel_tool_calls"]
    model_info:
      max_input_tokens: 245760           # 262144 − a 16384 output reserve
      max_output_tokens: 16384

  # THE FREE TIER. Same 26B weights, $0.00 both directions — OpenRouter rate-limits it rather
  # than charging, so it is the one route here that cannot cost anything. Treat it as a
  # courtesy, not a service: the limit is per account and shared with everything that key
  # touches. A 429 from this alias is normal, and it is what you get instead of a bill.
  #
  # THE PIN BELOW IS LOAD-BEARING FOR ANY AGENT RUN, AND REMOVING IT FAILS SILENTLY.
  # OpenRouter load-balances the free tier across providers, and one of them advertises tool
  # support but returns tool calls as RAW TEXT under agent-scale prompts —
  # `<|tool_call>call:write_todos{...}` in the content, with `tool_calls` absent. Nothing
  # errors. The agent sees an ordinary assistant message carrying no tool calls, executes
  # nothing, and exits cleanly, which reads as "the model chose not to act".
  #
  # `order: ["google-ai-studio"]` names the provider that does it correctly, and
  # `allow_fallbacks: false` stops OpenRouter routing round it when that provider is busy —
  # WITHOUT WHICH THE PIN DOES NOTHING, because being busy is exactly when it would reroute.
  # The cost of the pair is a 429 when Google AI Studio is at its limit, and that is the
  # intended trade: a visible failure over an invisible one.
  #
  # ENVOY CANNOT EXPRESS THIS PIN — it has no equivalent of extra_body — so this alias is
  # deliberately absent from envoy/config/openrouter.yaml and 404s on 26000. An unpinned copy
  # there would look like this route while carrying the failure the pin exists to stop.
  - model_name: openrouter-gemma4-26b-free
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0            # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
      max_tokens: 4096
      timeout: 600
      extra_body:
        provider:
          require_parameters: true
          order: ["google-ai-studio"]    # the provider that returns STRUCTURED tool calls
          allow_fallbacks: false         # without this the pin is advisory, not binding
    model_info:
      max_input_tokens: 229376           # 262144 − a 32768 output reserve
      max_output_tokens: 32768

  # Qwen 3.8 27B — the same model `lms-qwen38-27b` and `unsloth-qwen38-27b` run locally and
  # `cerebras-qwen38-27b` runs on Cerebras. Chat, vision, tools and structured output, and IT
  # THINKS: the thinking comes out of max_tokens, hence 16384, as on Cerebras.
  #
  # THE SPEND LOG RECORDS OPENROUTER'S OWN BILL, NOT THE PRICES BELOW. OpenRouter puts
  # `usage.cost` in its reply and LiteLLM logs that figure: a tool call logged $0.0002397423,
  # OpenRouter's `cost` to the last digit, where the prices below give $0.00038 (2026-09-29,
  # non-streaming, 320 of 327 prompt tokens a cache hit that the provider discounted).
  #
  # SO THE PRICES BELOW ARE THE FALLBACK, for a reply that carries no `usage.cost`, and they
  # are set where a ceiling trips early and never late. 16 providers serve these weights at
  # $0.025-$0.45 in and $1.875-$4.40 out per 1M (GET /api/v1/models/qwen/qwen3.8-27b/endpoints,
  # 2026-09-29) and OpenRouter picks one per call; $0.45 / $4.40 is the dearest on each side.
  # A cache hit is priced as full input, because without that line LiteLLM prices it from its
  # own cost map at about $0.01 / 1M — and an agent loop resends its history every turn.
  #
  # The same two provider settings as `openrouter-gemma4-26b`, for the same reasons: no
  # provider for these weights supports `parallel_tool_calls` either (same endpoints call).
  - model_name: openrouter-qwen38-27b
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000045   # FALLBACK — $0.45 / 1M, the dearest provider 2026-09-29
      output_cost_per_token: 0.0000044   # $4.40 / 1M
      cache_read_input_token_cost: 0.00000045  # a cache hit priced as full input — see above
      max_tokens: 16384
      timeout: 600
      extra_body:
        provider:
          require_parameters: true
      additional_drop_params: ["parallel_tool_calls"]
    model_info:
      max_input_tokens: 245760           # 262144 − a 16384 output reserve
      max_output_tokens: 16384
