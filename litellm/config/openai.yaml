# OpenAI — the whole config for this engine. IT SPENDS REAL MONEY.
#
# ONE ENGINE RUNS AT A TIME. `GATEWAY_ENGINE=openai` in .env points compose at THIS file, and
# the aliases below are then the entire vocabulary the gateway serves. Choosing this word is
# the act that makes spend possible — with a local engine selected instead, nothing in the
# running gateway can bill anyone.
#
# THIS FILE IS SELF-CONTAINED: it includes settings.yaml for the three settings blocks and
# declares its own aliases.
#
# THE ENGINE IS IN THE NAME. `frontier` lived here until 2026-08-31 and was renamed: it named
# a tier rather than a vendor, and it pointed at a *mini* model, so the name promised the
# opposite of the truth.
#
# IT NEEDS A KEY, from the shell, and the .env line stays blank. Without one LiteLLM keeps
# the alias and 401s at call time — the same failure shape as the Envoy gateway on 26000.
#
# `max_tokens` IS THE WRONG PARAMETER FOR THESE MODELS, AND ONLY THIS GATEWAY HIDES IT —
# FROM LITELLM v1.102.0 ON. gpt-6-luna and gpt-6.1-terra reject it outright — "Unsupported
# parameter: 'max_tokens' is not supported with this model. Use 'max_completion_tokens'
# instead." LiteLLM rewrites it only for a model name it recognises: 1.99.1 recognised
# "gpt-5" alone (llms/openai/chat/gpt_5_transformation.py, `is_model_gpt_5_model`), and
# v1.102.0 added "gpt-6" (`GPT_REASONING_SERIES_MARKERS`). The image went 1.99.1 -> 1.108.0
# on 2026-11-04 for exactly this. Measured that day, openai-gpt6-luna through 24000:
#                                       1.99.1   1.108.0
#   chat + max_tokens                    400      200
#   chat + max_completion_tokens         200      200
#   /v1/responses + max_output_tokens    200      200
#   /v1/messages (Claude Code's route)   400      200, `thinking` included
#   OpenCode (`max_tokens`)              —        200
# A PULL OF `main-stable` THAT LANDS BELOW v1.102.0 BRINGS THE 400s BACK. Envoy on 26000
# forwards `max_tokens` unchanged, so a body carrying it 400s there; its `-anthropic` twin
# translates Anthropic's ceiling correctly, and 400s on a body carrying `thinking`
# (TESTING.md §5.2). `max_completion_tokens` works on both gateways, so a caller driving
# both should send that. It is the one place this repo's "same alias, same body, different
# base_url" promise does not hold.
#
# THE PRICES ARE NOT WRITTEN HERE, UNLIKE EVERY OTHER ENGINE. LiteLLM ships a cost map
# covering OpenAI's own catalogue and keeps it current with the image, so a hardcoded price
# would go stale silently and UNDER-report spend — the one direction of error a budget
# ceiling cannot survive. The local routes need explicit numbers because they are free and
# nothing would price them at all; these do not.

include:
  - settings.yaml

model_list:
  # GPT 6 OR NEWER ONLY, by the owner's choice (2026-11-04). `openai-gpt54-mini` was removed
  # that day; it had no call through this gateway since the rename on 2026-09-29. Do not
  # bring an older model back — add the next GPT 6.x tier instead.
  #
  # TWO CHEAP TIERS. OpenAI names its tiers Astra > Sol > Terra > Luna, and Luna is the
  # cheapest in every generation that has one. Cheap on purpose: the point of this file is
  # a working hosted route, not the best answer money can buy, and a caller who wants Sol
  # changes one string.
  #
  # NO LADDER HERE ON PURPOSE. A hosted catalogue moves faster than this repo does, and a
  # stale model id is a 404 at call time rather than a clean error at startup.
  #
  # THERE IS NO `gpt-6.1-luna`. GET /v1/models/gpt-6.1-luna answered 404 on 2026-11-04 and
  # /v1/models listed only `gpt-6.1-sol` and `gpt-6.1-terra` for 6.1. So the cheapest 6.1 is
  # Terra, and the cheapest Luna is one generation back. Add `openai-gpt61-luna` the day the
  # list shows it.
  #
  # PRICES (LiteLLM's cost map, the same in 1.99.1 and 1.108.0; USD per 1M in / cached in / out):
  #   gpt-6-luna      0.10 / 0.01 / 0.50
  #   gpt-6.1-terra   1.00 / 0.05 / 5.00
  # Both reason, and both reject `max_tokens` (measured 2026-11-04, straight to
  # api.openai.com). This gateway rewrites it from v1.102.0 on — see the header.
  # VISION IS NOT TESTED: the cost map says both support it, and no image was sent.
  - model_name: openai-gpt6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 600                       # a hosted provider silent for 10 minutes is
                                         # broken, not loading weights from disk

  - model_name: openai-gpt61-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_key: os.environ/OPENAI_API_KEY
      timeout: 600

  # text-embedding-3-small at 1536 dimensions — NOT interchangeable with any local embedder
  # here. `lms-nomic-embed`, `unsloth-nomic-embed` and `ollama-nomic-embed` are all nomic v1.5
  # at 768 dims; this is a different model at twice the width, so an index built with one and
  # queried with the other does not merely degrade — the vector lengths do not match and it
  # cannot be read.
  #
  # TWO THINGS TO WEIGH BEFORE USING IT FOR RETRIEVAL. Every document you embed LEAVES THIS
  # MACHINE, which the three local embedders never do. And an embedding workload is many
  # small calls, so this is the alias most able to run up a bill without any single call
  # looking expensive — put a ceiling on the key that holds it.
  - model_name: openai-embed3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      timeout: 600
    model_info:
      max_input_tokens: 8191             # the model's own limit, not a reserve calculation
