# Unsloth Studio (port 8888) — the whole config for this engine.
#
# ONE ENGINE RUNS AT A TIME. `GATEWAY_ENGINE=unsloth` in .env points compose at THIS file,
# and the aliases below are then the entire vocabulary the gateway serves.
#
# THIS FILE IS SELF-CONTAINED: it includes settings.yaml for the three settings blocks and
# declares its own aliases.
#
# THE MODELS ARE THE SAME WEIGHTS `lms-*` AND `ollama-*` SERVE, which is the point — change
# GATEWAY_ENGINE, re-run tests/, and the only thing that moved is the engine.
#
# FOUR THINGS DIFFER FROM LMSTUDIO, and each fails quietly:
#
#   THE PREFIX IS `openai/`, NOT `unsloth/`. LiteLLM has no Unsloth provider. A provider
#   prefix means "speaks the OpenAI protocol", and api_base is the only thing separating
#   this from api.openai.com. The model id then carries its own slash, so the strings below
#   have TWO — only the first is the provider.
#
#   IT REQUIRES A KEY. LMStudio takes any string; Unsloth answers 401 on every route without
#   one, `/v1/models` included. It is personal, so it arrives from the shell and the line in
#   .env stays blank. A BLANK KEY FAILS AT CALL TIME, NOT AT STARTUP: LiteLLM keeps the alias
#   and answers 401 when you call it, and the Envoy gateway on 26000 does the same. Nothing
#   complains while the gateway boots.
#
#   A GATEWAY CALL SWAPS ONE ACTIVE MODEL, and that slot SPANS chat and the embedder: calling
#   `unsloth-nomic-embed` unloads `unsloth-gemma4-26b`, and the next chat call swaps it back. So a
#   retrieval loop that alternates embed and chat pays a model swap on every call — 13-17 s
#   each, measured 2026-10-07. Auto-switch replaces only the model the last plain load brought
#   in, which Studio calls ACTIVE — not the least recently used one. `Settings > API > Model
#   auto-switch` must be ON or the second alias you call returns 400 "No model loaded". Leave
#   `auto_download_model` OFF, or an unknown model id becomes a multi-gigabyte download rather
#   than an error.
#
#   A MODEL PRE-LOADED IN STUDIO STAYS BESIDE THE ACTIVE ONE (Studio v0.1.903-beta). It needs
#   `Settings > Resources > Keep multiple models loaded` — off by default, ON on this laptop
#   since 2026-10-07 — and a load with `Keep other models loaded` in Studio's model picker, or
#   `"alongside": true` on `POST /api/inference/load`. NO GATEWAY CALL CAN LOAD ONE THAT WAY:
#   auto-switch only ever replaces the active slot. `GET /api/inference/loaded-models` lists
#   what is held. Measured 2026-10-07 with E4B, the 26B and `unsloth-nomic-embed` held at once:
#   0.0-0.3 s per call on 8888 and through 24000, nothing evicted; E4B and the 26B decoding at
#   the same moment ran ~95 tok/s each against ~140 alone, 3.7 s for the pair against ~5.3 s
#   one after the other. When memory runs out Studio unloads the least recently used held
#   model first (unslothai/unsloth#11591) — not measured here, 128 GB never ran out.
#
#   THE OTHER EXCEPTION IS STUDIO'S OWN EMBEDDER — the model in `Settings -> embedding model`.
#   Studio runs it in a separate process BESIDE the chat model, so it evicts nothing. That is
#   `unsloth-nomic-embed-sidecar` below. Measured 2026-10-03 with the 26B loaded: the sidecar
#   answered in 0.04 s and the 26B stayed loaded; `unsloth-nomic-embed` replaced the 26B, and
#   the next chat call took 13.4 s to load it back.
#
#   IT TURNS REASONING ON where LMStudio does not. Verified 2026-08-27: `unsloth-gemma4-26b`
#   returns a reasoning block that `lms-gemma4-26b` — the identical gemma-4-26b-a4b-qat — does not.
#   At max_tokens 60 the reply came back EMPTY with finish_reason `length`, the whole budget
#   spent thinking. Hence the larger max_tokens below.
#
# `GET /v1/status` on 8888 is this engine's truth, and it needs the key too.

include:
  - settings.yaml

model_list:
  # `lms-gemma4-e4b`'s twin: Gemma 4 E4B, the small chat route, tools and vision both working.
  - model_name: unsloth-gemma4-e4b
    litellm_params:
      model: openai/unsloth/gemma-4-E4B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012    # shadow price, so budget ceilings still trip
      output_cost_per_token: 0.00000035
      max_tokens: 8192                    # reasoning and reply share this — see above
      timeout: 3600                       # see the timeout note in settings.yaml
    model_info:
      max_input_tokens: 122880            # 131072 − the 8192 output reserve
      max_output_tokens: 8192

  # `lms-gemma4-12b`'s twin, and THE SAME FILE, not an Unsloth upload: Studio lists LMStudio's
  # models folder too, and lmstudio-community/gemma-4-12B-it-QAT-GGUF is the only Gemma 4 12B on
  # this disk — one Q4_0, so a bare name cannot load a different quant. A dense 12B: it saves
  # memory against the 26B below and costs speed — 58–60 tok/s decode against 137–198, the
  # session 41–132 s against 7–18 s (run_benchmark.py, two runs, 2026-10-03). Window 262144,
  # read from GET /v1/status with this model loaded. lms.yaml has the full note.
  - model_name: unsloth-gemma4-12b
    litellm_params:
      model: openai/lmstudio-community/gemma-4-12B-it-QAT-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012    # no hosted twin — see lms-gemma4-12b
      output_cost_per_token: 0.00000035
      max_tokens: 8192                    # reasoning and reply share this — see above
      timeout: 3600
    model_info:
      max_input_tokens: 253952            # 262144 − the 8192 output reserve
      max_output_tokens: 8192

  # `lms-gemma4-26b`'s twin: the same gemma-4-26b-a4b-qat weights on a different engine. This
  # pair is the cleanest engine comparison in the repo — identical build, identical model.
  - model_name: unsloth-gemma4-26b
    litellm_params:
      model: openai/unsloth/gemma-4-26B-A4B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 8192                    # it reasons here and does not on LMStudio
      timeout: 3600
    model_info:
      # 262144 − the 8192 output reserve, read from Unsloth's own GET /v1/status with the
      # model loaded, not copied from the LMStudio twin.
      max_input_tokens: 253952
      max_output_tokens: 8192

  # THE FAST ROUTE: `unsloth-gemma4-26b` WITH THINKING OFF. The same model id, so the same
  # loaded file — calling one after the other swaps nothing. A caller that wants speed changes
  # the name and nothing else. To think, call `unsloth-gemma4-26b`. A caller's thinking LEVEL
  # does not turn it back on; a body that says `enable_thinking: true` outright does, because
  # LiteLLM lets the caller's field win over `extra_body` (2026-10-04). Envoy's copy overwrites
  # it, so there nothing turns it back on.
  #
  # NO `lms-` TWIN IS NEEDED: LMStudio does not turn Gemma's reasoning on at all (see the note
  # at the top), so `lms-gemma4-26b` already answers like this.
  - model_name: unsloth-gemma4-26b-fast
    litellm_params:
      model: openai/unsloth/gemma-4-26B-A4B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 8192
      timeout: 3600
      # WHY:        Unsloth turns Gemma's thinking on by default, and it is most of the wait.
      #             One question on 8888 direct: 697 reasoning chars, 301 tokens, 1.7 s with
      #             it; none, 14 tokens, 0.2 s without. EACH ROUTE OBEYS A DIFFERENT FIELD, so
      #             both go: `enable_thinking` on chat and /v1/messages, `chat_template_kwargs`
      #             on /v1/responses. Together they hold against a caller's `reasoning_effort:
      #             high`, Codex's `reasoning` and Claude Code's `thinking: adaptive`.
      # SCOPE:      provider=openai (Unsloth)  route=all three  client=every folder
      # PROVEN:     2026-10-04, the 26B loaded. 8888 direct: the numbers above. Through this
      #             route: chat, /v1/responses and /v1/messages each 14 tokens and no thinking
      #             block, against 331–544 tokens with one on `unsloth-gemma4-26b`
      # TRIED AND REJECTED: `enable_thinking` alone — /v1/responses still thought (903
      #             chars). `chat_template_kwargs` alone — /v1/messages still thought (886),
      #             and a caller's `reasoning_effort` beat it on chat (864). `reasoning_effort:
      #             none` — never reaches the engine through this route.
      # GUARDED BY: tests/2_openai_client/06_thinking_off.py --model unsloth-gemma4-26b-fast
      extra_body:
        enable_thinking: false
        chat_template_kwargs:
          enable_thinking: false
    model_info:
      max_input_tokens: 253952            # 262144 − the 8192 output reserve
      max_output_tokens: 8192

  # Qwen 3.8 27B, the SAME MODEL as `lms-qwen38-27b` but NOT THE SAME BUILD: this is Unsloth's
  # UD-Q8_K_XL GGUF, 31.5 GB, where LMStudio runs the 16 GB MLX 4-bit. A dense 27B that thinks
  # before it answers — see lms.yaml for the measurement behind max_tokens and the price.
  #
  # WHY NOT THE MLX BUILD LMSTUDIO USES: Unsloth serves its Anthropic route, POST /v1/messages,
  # for GGUF models ONLY. With the MLX build loaded it answered 503 "No GGUF model loaded. Load
  # a GGUF model first." — on 8888 directly, no gateway in the path — and Envoy's
  # `unsloth-qwen38-27b-anthropic` needs that route. The GGUF answered it with a thinking block
  # (both 2026-09-29). This file is not what needs the route, but one alias, one build: the
  # two gateways must mean the same weights by this name.
  #
  # PINNED WITH `:UD-Q8_K_XL` (2026-10-02). The repo also holds UD-Q4_K_XL on this disk, and a
  # bare repo name loads whichever quant ranks first in Unsloth's GGUF_QUANT_PREFERENCE — the
  # Q4. Q8 was chosen on speed: 23 against 21 tok/s, faster in 12 of 14 paired sessions of
  # `run_benchmark.py`, both with Unsloth's MTP draft (COMPARISON.md § Per client and per model).
  # Window 262144, read from GET /v1/status with this model loaded.
  - model_name: unsloth-qwen38-27b
    litellm_params:
      model: openai/unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.000001875
      max_tokens: 8192
      timeout: 3600
      # WHY:        `drop_params: true` DELETES `reasoning_effort` on this `openai/` route too,
      #             so Qwen's template ran its default, `xhigh`, for every caller. One system +
      #             user message, `max_tokens: 1`: 62 prompt tokens at `xhigh` and 24 at
      #             `medium` on 8888 direct, 62 and 62 through this route (2026-09-30). The
      #             full reasoning, and what `xhigh` costs, is on `lms-qwen38-27b` in lms.yaml.
      #             Unsloth's own /v1/messages ignores Claude Code's `output_config.effort`
      #             with no gateway in between (62 and 62 on 8888), so no line here reaches it.
      # SCOPE:      provider=openai (Unsloth)  route=/v1/chat/completions  client=every tests/
      #             folder that sends a level
      # PROVEN:     see GUARDED BY — green with this line, red without it (2026-09-30)
      # GUARDED BY: tests/2_openai_client/05_reasoning_effort.py --model unsloth-qwen38-27b
      allowed_openai_params: ["reasoning_effort"]
      # THE LEVEL FOR A CALLER WHO SENDS NONE — `medium`, not the template's `xhigh`. A caller's
      # own level still wins. Why, and every route measured: `lms-qwen38-27b` in lms.yaml.
      # PROVEN:     2026-09-30, prompt tokens with no level / at `xhigh`: chat 24 / 62,
      #             /v1/responses 24 / 62, /v1/messages 24 (4 + 20 cache-read)
      # GUARDED BY: tests/2_openai_client/05_reasoning_effort.py --model unsloth-qwen38-27b
      reasoning_effort: medium
    model_info:
      max_input_tokens: 253952            # 262144 − the 8192 output reserve
      max_output_tokens: 8192

  # The Q8_0 build of the same nomic v1.5 the other engines serve — more fidelity per vector,
  # and NOT interchangeable with theirs. `lms-nomic-embed` is Q4_K_M, `ollama-nomic-embed` is
  # F16, and `openai-embed3-small` is a different model at 1536 dims. An index built with one
  # alias and queried with another returns quietly worse neighbours and never errors. See
  # lms.yaml.
  #
  # REMEMBER THE ONE-MODEL LIMIT: calling this evicts whichever chat model is loaded.
  - model_name: unsloth-nomic-embed
    litellm_params:
      model: openai/second-state/Nomic-embed-text-v1.5-Embedding-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048              # context_length from Unsloth's GET /v1/status

  # STUDIO'S OWN EMBEDDER, run BESIDE the chat model — so, unlike every other alias in this
  # file, calling it evicts nothing (measured 2026-10-03, see the note at the top). A RAG loop
  # that embeds and then chats needs this one: with `unsloth-nomic-embed` it pays two model
  # swaps per question.
  #
  # IT IS ONLY THE SIDECAR WHILE THIS EXACT ID IS STUDIO'S `Settings -> embedding model`. Set
  # anything else there and this name goes through auto-switch like the alias above, and
  # evicts the chat model again — with no error to say so.
  #
  # THE SAME nomic v1.5, A DIFFERENT BUILD from `unsloth-nomic-embed` (nomic-ai's own release,
  # not second-state's GGUF), so vectors from the two are NOT interchangeable. ai-agent-rag's
  # vector stores are built with this one.
  #
  # The model reads 2048 tokens, but Studio runs this embedder at 512 and answers 400 to an
  # input over 510 (measured 2026-09-27, ai-agent-rag).
  - model_name: unsloth-nomic-embed-sidecar
    litellm_params:
      model: openai/nomic-ai/nomic-embed-text-v1.5
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 512
