# COMPOSED CONFIG — the STARTER list, LMSTUDIO only. Two aliases: lms-4b, lms-embed.
#
# compose loads exactly ONE file from this directory, and its name is two words from `.env`:
#
#   config.${GATEWAY_MODELS:-starter}.${GATEWAY_ENGINE:-all}.yaml
#
# so this file is what you get from:
#
#   GATEWAY_MODELS=starter        # or leave it out — starter is the default
#   GATEWAY_ENGINE=lms
#
# NOTHING IS DECLARED HERE. The aliases are in starter/lms.yaml and the settings blocks are
# in settings.yaml; this file only names them. Edit those, not this one.
#
# The MLflow gateway is selected by the SAME two words and reads its own list —
# mlflow/starter/lms.py. It does not read this file. Add an alias to one side only and the
# name answers on 24000 and 404s on 25000.

include:
  - settings.yaml
  - starter/lms.yaml
