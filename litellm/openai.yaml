# OpenAI — the whole config for this engine. IT SPENDS REAL MONEY.
#
# ONE ENGINE RUNS AT A TIME. `GATEWAY_ENGINE=openai` in .env points compose at THIS file, and
# the aliases below are then the entire vocabulary the gateway serves. Choosing this word is
# the act that makes spend possible — with a local engine selected instead, nothing in the
# running gateway can bill anyone.
#
# THIS FILE IS SELF-CONTAINED: it includes settings.yaml for the three settings blocks and
# declares its own aliases.
#
# THE ENGINE IS IN THE NAME. `frontier` lived here until 2026-08-31 and was renamed: it named
# a tier rather than a vendor, and it pointed at a *mini* model, so the name promised the
# opposite of the truth.
#
# IT NEEDS A KEY, from the shell, and the .env line stays blank. Without one LiteLLM keeps
# the alias and 401s at call time while the MLflow seed skips the endpoint — so the same name
# 401s on 24000 and 404s on 25000.
#
# `max_tokens` IS THE WRONG PARAMETER FOR THESE MODELS, AND ONLY THIS GATEWAY HIDES IT.
# The gpt-5 family rejects it outright — "Unsupported parameter: 'max_tokens' is not
# supported with this model. Use 'max_completion_tokens' instead." LiteLLM translates it for
# you, so a caller on 24000 never notices. MLflow forwards parameters exactly as sent, so THE
# SAME BODY 400s ON 25000 (verified 2026-08-31). `max_completion_tokens` works on both, so a
# caller driving both gateways should send that. It is the one place this repo's "same alias,
# same body, different base_url" promise does not hold.
#
# THE PRICES ARE NOT WRITTEN HERE, UNLIKE EVERY OTHER ENGINE. LiteLLM ships a cost map
# covering OpenAI's own catalogue and keeps it current with the image, so a hardcoded price
# would go stale silently and UNDER-report spend — the one direction of error a budget
# ceiling cannot survive. The local routes need explicit numbers because they are free and
# nothing would price them at all; these do not.

include:
  - settings.yaml

model_list:
  # gpt-5.4-mini — the small, fast, cheap tier. It is here rather than a larger model because
  # the point of this file is a working hosted route, not the best answer money can buy: a
  # caller who wants the big one changes one string.
  #
  # NO LADDER HERE ON PURPOSE. A hosted catalogue moves faster than this repo does, and a
  # stale model id is a 404 at call time rather than a clean error at startup.
  #
  # IT HAS NO VISION, so tests/03_multimodal.py cannot pass against it. That is why tests/
  # never picks an `openai-*` alias as its default — see tests/common.py.
  - model_name: openai-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 600                       # a hosted provider silent for 10 minutes is
                                         # broken, not loading weights from disk

  # text-embedding-3-small at 1536 dimensions — NOT interchangeable with any local embedder
  # here. `lms-embed`, `unsloth-embed` and `ollama-embed` are all nomic v1.5 at 768 dims; this
  # is a different model at twice the width, so an index built with one and queried with the
  # other does not merely degrade — the vector lengths do not match and it cannot be read.
  #
  # TWO THINGS TO WEIGH BEFORE USING IT FOR RETRIEVAL. Every document you embed LEAVES THIS
  # MACHINE, which the three local embedders never do. And an embedding workload is many
  # small calls, so this is the alias most able to run up a bill without any single call
  # looking expensive — put a ceiling on the key that holds it.
  - model_name: openai-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      timeout: 600
    model_info:
      max_input_tokens: 8191             # the model's own limit, not a reserve calculation
