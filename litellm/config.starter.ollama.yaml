# COMPOSED CONFIG — the STARTER list, OLLAMA only. Two aliases: ollama-4b, ollama-embed.
#
# compose loads exactly ONE file from this directory, and its name is two words from `.env`:
#
#   config.${GATEWAY_MODELS:-starter}.${GATEWAY_ENGINE:-all}.yaml
#
# so this file is what you get from:
#
#   GATEWAY_MODELS=starter        # or leave it out — starter is the default
#   GATEWAY_ENGINE=ollama
#
# NOTHING IS DECLARED HERE. The aliases are in starter/ollama.yaml and the settings blocks
# are in settings.yaml; this file only names them. Edit those, not this one.
#
# Pull the two models first:  ollama pull gemma4:e4b && ollama pull nomic-embed-text

include:
  - settings.yaml
  - starter/ollama.yaml
