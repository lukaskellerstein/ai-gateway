# =============================================================================
# LiteLLM — a STANDALONE compose project. http://localhost:24000, UI at /ui.
# Works with both `podman compose up -d` and `docker compose up -d`.
#
# Run it from THIS directory. Nothing above it is read, and nothing here reads
# ../envoy. That is the whole point: delete a sibling folder and this keeps
# working — which is exactly what happened to ../mlflow on 2026-09-04.
#
#   cd litellm && podman compose up -d
#
# TWO WORDS IN ./.env DECIDE WHAT THIS SERVES:
#
#   GATEWAY_ENGINE     lms | unsloth | ollama | openrouter | openai   default lms
#   GATEWAY_DISCOVERY  (empty) | on                                   default EMPTY
#
# THERE IS NO COMPOSE_PROFILES ANY MORE. Before the split one variable chose which
# gateway ran; now the DIRECTORY is that choice. `up -d` here starts this gateway
# and nothing else, and an empty .env starts it too — the old trap where a missing
# word brought up postgres alone is gone with the profiles.
#
# EACH GATEWAY IS ITS OWN PROJECT AND ITS OWN .env, so this one can serve `lms`
# while ../envoy serves `ollama`. That is now allowed. It also means nothing
# checks that the same alias answers on both — the check that used to do it went
# with the shared tests/.
#
# HOST PORT 24000. The 2xxxx band keeps this stack out of the way of two others on
# this machine (mlflow-tutorial holds 4000/5432/8080/9090, ai-agent-platform holds
# 1xxxx). The failure that avoids is not a loud bind error but the silent one: a
# health probe against localhost:4000 that a different project's gateway answers.
# =============================================================================

# ---------------------------------------------------------------------------
# DO NOT RENAME THIS PROJECT. The volume below resolves to `<name>_postgres_data`,
# so `ai-gateway` is what keeps this pointed at `ai-gateway_postgres_data` — the
# volume that has held every virtual key, spend log and budget ceiling since
# before the split. Change the word and compose creates a NEW EMPTY volume,
# LiteLLM migrates a fresh schema, and every key other projects on this laptop
# hold stops working. Nothing errors; it just comes up empty.
#
# The sibling project uses `ai-gateway-envoy`, so containers stay distinguishable
# and both can run at once.
# ---------------------------------------------------------------------------
name: ai-gateway

services:
  # ---------------------------------------------------------------------------
  # Postgres — virtual keys, teams, spend logs, budget ceilings.
  #
  # NO PUBLISHED HOST PORT, deliberately: only litellm connects, over the compose
  # network. Publishing buys nothing and collides with 5432 (mlflow-tutorial's).
  # For a shell: `podman compose exec postgres psql -U postgres -d litellm`.
  #
  # ONE DATABASE, AND THIS SERVER IS THE ONLY ONE IN THE REPO. Before the 2026-09-03
  # split it also carried `mlflow`, created by postgres/init-databases.sh, because
  # POSTGRES_DB takes exactly one name. That gateway got its own postgres at the
  # split and was deleted on 2026-09-04, so the script is gone and this needs no
  # init hook at all. On the pre-split volume the old `mlflow` database is still
  # there, unused and harmless — postgres only runs init hooks on an EMPTY data
  # directory, so nothing rewrites it either way.
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litellm
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # discover — writes this gateway's config when auto-discovery is on, then exits.
  #
  # A CONTAINER THAT EXITS 0 IS THE FINISHED STATE, not a failure.
  #
  # With GATEWAY_DISCOVERY empty — the default — it exits in about a second having
  # written nothing, and litellm reads the hand-written config/<engine>.yaml
  # exactly as it always has. Set it and this asks the engine what it holds and
  # writes config/discovered-<engine>.yaml, which INCLUDES the hand-written file.
  # So discovery only ever ADDS aliases; nothing a project already calls can break.
  #
  # THIS MODULE IS THIS GATEWAY'S OWN, AND NOW THE ONLY COPY. ../mlflow carried a
  # second one trimmed to the probing half, and it went with that folder on
  # 2026-09-04. ../envoy has no discovery at all — its config would need a third
  # renderer and its image is distroless, with no Python to run one in.
  #
  # IT USES THE LITELLM IMAGE because it needs a Python and that image ships one.
  # The module reaches for nothing outside the standard library, so there is STILL
  # NO BUILD STEP.
  #
  # ./config IS MOUNTED READ-WRITE HERE and read-only on litellm below: this is the
  # one thing in the stack that writes into the repo, and the file it writes is
  # gitignored.
  # ---------------------------------------------------------------------------
  discover:
    image: ghcr.io/berriai/litellm:main-stable
    restart: "no"
    entrypoint: ["python"]
    command: ["/app/discover/gateway_discovery.py"]
    volumes:
      - ./discover:/app/discover:ro
      - ./config:/app/config
    extra_hosts:
      # It dials the engine on the host, so it needs the same two names the
      # gateway does.
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    environment:
      GATEWAY_ENGINE: ${GATEWAY_ENGINE:-lms}
      GATEWAY_DISCOVERY: ${GATEWAY_DISCOVERY:-}
      LITELLM_CONFIG_DIR: /app/config
      # Where to ask. Only the three LOCAL engines are ever discovered — OpenRouter
      # and OpenAI bill a real account per model, so they keep hand-written lists.
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.containers.internal:1234/v1}
      UNSLOTH_API_BASE: ${UNSLOTH_API_BASE:-http://host.containers.internal:8888/v1}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.containers.internal:11434/v1}

  # ---------------------------------------------------------------------------
  # LiteLLM proxy — one OpenAI-compatible endpoint (also /v1/messages) for every
  # provider. http://localhost:24000, admin UI at /ui.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      # The config file may be GENERATED, so wait for the generator whether or not
      # it had anything to do. With discovery off that is a one-second no-op; the
      # price of no dependency is litellm crash-looping on a file that arrives a
      # moment later.
      discover: { condition: service_completed_successfully }
    # WHICH ALIASES THIS GATEWAY SERVES, in one filename built from ONE word in
    # .env. config/ carries one self-contained file per engine:
    #
    #   config/lms.yaml         3 aliases: 2 chat, 1 embedder      free
    #   config/unsloth.yaml     3 aliases: 2 chat, 1 embedder      free
    #   config/ollama.yaml      3 aliases: 2 chat, 1 embedder      free
    #   config/openrouter.yaml  2 aliases: 2 chat                  PAID
    #   config/openai.yaml      2 aliases: 1 chat, 1 embedder      PAID
    #
    # Each includes config/settings.yaml for the three settings blocks and then
    # declares its own model_list. ONE ENGINE RUNS AT A TIME.
    #
    # A TYPO IS A CLEAN CRASH: the file does not exist and litellm exits saying so.
    # (It was NOT clean before 2026-08-31, when this mounted a single file: compose
    # bind-mounts a missing source by CREATING AN EMPTY DIRECTORY, and the proxy
    # then crash-looped on `IsADirectoryError` while `compose ps` still said Up.
    # Mounting the directory is what removed that trap.)
    #
    # THE `discovered-` PREFIX IS THE WHOLE AUTO-DISCOVERY SWITCH. `${VAR:+text}`
    # substitutes `text` when VAR is set and NON-EMPTY, so one word moves the
    # filename and no second variable can fall out of step with it:
    #
    #   GATEWAY_DISCOVERY unset/empty  ->  /app/config/lms.yaml
    #   GATEWAY_DISCOVERY=on           ->  /app/config/discovered-lms.yaml
    #
    # IT REACTS TO THE WORD BEING NON-EMPTY, NOT TO ITS MEANING, so
    # `GATEWAY_DISCOVERY=off` switches discovery ON here. The `discover` service
    # catches `off`, `false`, `0` and `no` and exits 2 saying to leave the value
    # EMPTY, which is why litellm waits on it.
    command: ["--config", "/app/config/${GATEWAY_DISCOVERY:+discovered-}${GATEWAY_ENGINE:-lms}.yaml", "--port", "4000", "--num_workers", "1"]
    ports:
      - "24000:4000"
    volumes:
      # The whole directory, because every engine config carries
      # `include: [settings.yaml]` and that relative path must resolve next to it.
      # Mount the one engine file alone and the settings vanish.
      #
      # IT LANDS ON /app/config AND NOT /app/litellm: the image already ships
      # /app/litellm, which is the proxy's own Python package, and mounting over it
      # breaks the container.
      #
      # config/ IS A SUBDIRECTORY and not this folder itself, because this folder
      # now also holds .env, compose.yml and tests/ — none of which belongs inside
      # a container.
      - ./config:/app/config:ro
    extra_hosts:
      # Lets the container reach the local engines on the host under Docker
      # (Podman adds host.containers.internal automatically; this covers both).
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    environment:
      # The ADMINISTRATIVE credential: it mints virtual keys and has no spending
      # ceiling of its own. Callers get a budgeted virtual key, never this.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master}
      # REQUIRED, not optional. Without it the proxy boots in no-DB mode:
      # completions keep working while `/key/generate` fails with
      # {"error":"No connected db."} — the worst failure for a budget guardrail,
      # because callers then proceed uncapped and nothing looks broken.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/litellm
      # store_prompts_in_spend_logs truncates each stored string at 2048 chars by
      # default, which clips agent transcripts mid-run.
      MAX_STRING_LENGTH_PROMPT_IN_DB: "100000"
      # The three LOCAL engines, all running NATIVELY on the host for the GPU. All
      # three bind 127.0.0.1 only, and the container still reaches them at
      # host.containers.internal (checked from inside this container, 2026-08-26).
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.containers.internal:1234/v1}
      # Unsloth NEEDS a key: every route answers `401 Not authenticated` without
      # one. It is a personal credential, so it arrives from the shell and the line
      # in .env stays blank — see .env.example.
      UNSLOTH_API_BASE: ${UNSLOTH_API_BASE:-http://host.containers.internal:8888/v1}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      # NO OLLAMA KEY VARIABLE, and that is not an omission: Ollama does not read
      # the Authorization header at all. The literal `sk-ollama` in the config is
      # there only because LiteLLM's `openai/` provider needs some key string.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.containers.internal:11434/v1}
      # The two PAID engines. Neither is in the running config at all unless
      # GATEWAY_ENGINE names it. Blank in .env on purpose: ~/Projects/.envrc
      # exports the real values and compose reads the SHELL before the file, so no
      # second plaintext copy exists to go stale after a rotation.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      # /health/liveliness is unauthenticated — it answers without the master key,
      # which /health does not. urllib rather than curl: the base image ships
      # python and is not guaranteed to ship curl.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot runs the LiteLLM schema migrations against an empty database.
      start_period: 60s

volumes:
  # Resolves to `ai-gateway_postgres_data` — see the note on `name:` above.
  postgres_data:
