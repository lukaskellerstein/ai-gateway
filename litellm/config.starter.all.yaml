# COMPOSED CONFIG — the STARTER list on ALL THREE ENGINES. Six aliases, and THE DEFAULT.
#
#            LMStudio (1234)   Unsloth (8888)   Ollama (11434)
#   chat     lms-4b            unsloth-4b       ollama-4b        Gemma 4 E4B
#   embed    lms-embed         unsloth-embed    ollama-embed     nomic-embed-text v1.5
#
# compose loads exactly ONE file from this directory, and its name is two words from `.env`:
#
#   config.${GATEWAY_MODELS:-starter}.${GATEWAY_ENGINE:-all}.yaml
#
# Both words default, so THIS is the file a fresh clone gets with an empty `.env`.
#
# THE SHAPE IS THE LESSON: two models, three engines, so you measure the engine by changing
# the alias and nothing else. Six small models are ~17 GB with all three engines installed,
# against ~90 GB for the full list — nobody should download that to try the repo.
#
# YOU DO NOT NEED ALL THREE ENGINES. Install whichever you already use; the aliases for an
# engine that is not running simply fail when called and the others keep working. To drop
# them from the config entirely, name one engine instead:
#
#   GATEWAY_ENGINE=ollama         # -> config.starter.ollama.yaml, two aliases
#
# NOTHING IS DECLARED HERE. The aliases are in the three fragments below and the settings
# blocks are in settings.yaml. Edit those, not this one.

include:
  - settings.yaml
  - starter/lms.yaml
  - starter/unsloth.yaml
  - starter/ollama.yaml
