[project]
name = "litellm-tests-claude-agent-sdk"
version = "0.1.0"
description = "Anthropic's Claude Agent SDK pointed at the LiteLLM gateway"
readme = "README.md"
requires-python = ">=3.12"
# The SDK is a thin wrapper over the `claude` CLI, which must already be on PATH —
# `npm i -g @anthropic-ai/claude-code`. There is no pip package for the CLI itself,
# so `uv sync` cannot install it and common.py checks for it before starting.
#
# `mcp` ARRIVES WITH THE SDK ANYWAY, and is named here because 04_stdio_mcp.py
# imports it directly. A transitive dependency that a file imports by name is one
# upstream release away from disappearing.
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "anyio>=4.15.0",
    "mcp>=2.1.1",
]

[tool.uv]
package = false
