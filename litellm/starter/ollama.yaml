# Ollama (port 11434) — THE STARTER FRAGMENT. Two aliases: one chat, one embedder.
#
# A FRAGMENT IS NOT A CONFIG. It carries `model_list` and nothing else; the composed files
# `config.starter.ollama.yaml` and `config.starter.all.yaml` include it alongside
# settings.yaml, which holds the settings blocks, the pricing rules and the timeout note.
#
# These are the same two models the other two starter fragments serve — with one caveat on
# the build, below.
#
# The least fussy engine: it loads on demand, holds several models at once, and needs no key
# at all. Three notes anyway:
#
#   THE PREFIX IS `openai/`, NOT `ollama/`, AND THAT IS A CHOICE. LiteLLM does ship an
#   `ollama_chat` provider. It is not used because Ollama's /v1 layer is already
#   OpenAI-compatible and returns structured tool_calls (verified 2026-08-27), so the native
#   prefix buys nothing while `openai/` keeps these routes shaped exactly like the
#   `unsloth-*` ones. Switching is a real option; it is a separate change and needs its own
#   tool-calling test.
#
#   THE KEY IS IGNORED, AND ONE IS SET ANYWAY. Ollama never reads Authorization.
#   `sk-ollama` is here because LiteLLM's `openai/` provider needs SOME key string — with
#   none it falls back to OPENAI_API_KEY, which is blank, and the route errors.
#
#   IT EVICTS AN IDLE MODEL AFTER 5 MINUTES by default, so the second call of a session can
#   be as slow as the first. `ollama ps` says what is resident; `ollama list` only says what
#   is on disk. OLLAMA_KEEP_ALIVE changes it machine-wide.
#
# Pull what this file names before calling it:
#   ollama pull gemma4:e4b && ollama pull nomic-embed-text

model_list:
  # The `gemma4:e4b` tag is Q4_K_M — quantised after training — while the LMStudio and
  # Unsloth routes are QAT, trained around the quantisation. So ollama-4b against either of
  # them measures ENGINE AND BUILD together. Say which you are claiming.
  - model_name: ollama-4b
    litellm_params:
      model: openai/gemma4:e4b
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"                # ignored by Ollama; see the note above
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 8192                    # it thinks here too — see note 3 in settings.yaml
      timeout: 3600                       # a cold load reads ~10 GB from disk first
    model_info:
      max_input_tokens: 122880            # gemma4.context_length 131072 − the reserve
      max_output_tokens: 8192

  # The same MODEL as `lms-embed` and `unsloth-embed` — nomic-embed-text v1.5, 768 dimensions,
  # a 2048 window, verified 2026-08-27 from GET /api/show — but NOT THE SAME BUILD. This one
  # is F16 at 274 MB, against `lms-embed`'s Q4_K_M at 84 MB and `unsloth-embed`'s Q8_0 at
  # 146 MB (measured 2026-08-31, `ollama show` and `lms ls --json`). All three embedders in
  # this list are a different quantisation, so NONE of them is a drop-in twin of another:
  # see the note in starter/lms.yaml for what that costs an index.
  - model_name: ollama-embed
    litellm_params:
      model: openai/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048              # nomic-bert.context_length from GET /api/show
