# Unsloth Studio (port 8888) — THE STARTER FRAGMENT. Two aliases: one chat, one embedder.
#
# A FRAGMENT IS NOT A CONFIG. It carries `model_list` and nothing else; the composed files
# `config.starter.unsloth.yaml` and `config.starter.all.yaml` include it alongside
# settings.yaml, which holds the settings blocks, the pricing rules and the timeout note.
#
# These are the same two models `starter/lms.yaml` and `starter/ollama.yaml` serve, so the
# engine is the only thing that changes when you change the alias.
#
# THREE THINGS DIFFER FROM LMSTUDIO, and each fails quietly:
#
#   THE PREFIX IS `openai/`, NOT `unsloth/`. LiteLLM has no Unsloth provider. A provider
#   prefix means "speaks the OpenAI protocol", and api_base is the only thing separating
#   this from api.openai.com. The model id then carries its own slash, so the strings below
#   have TWO — only the first is the provider.
#
#   IT REQUIRES A KEY. LMStudio takes any string; Unsloth answers 401 on every route without
#   one, `/v1/models` included. It is personal, so it arrives from the shell and the line in
#   .env stays blank. A BLANK KEY FAILS TWICE, DIFFERENTLY: LiteLLM keeps the alias and 401s
#   at call time, while the MLflow seed skips the endpoint entirely — so the same name 401s
#   on 24000 and 404s on 25000.
#
#   IT SERVES ONE MODEL AT A TIME, and that limit SPANS chat and the embedder: calling
#   unsloth-embed unloads unsloth-4b, and the next chat call swaps it back.
#   `Settings > API > Model auto-switch` must be ON or the second alias you call returns
#   400 "No model loaded". Use lms-embed or ollama-embed inside a retrieval loop.

model_list:
  - model_name: unsloth-4b
    litellm_params:
      model: openai/unsloth/gemma-4-E4B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 8192                    # it reasons, and Unsloth is the wordiest of the
                                          # three about it — see note 3 in settings.yaml
      timeout: 3600                       # see the timeout note in settings.yaml
    model_info:
      max_input_tokens: 122880            # 131072 − the same 8192 output reserve
      max_output_tokens: 8192

  # The Q8_0 build of the same nomic v1.5 the other two engines serve — more fidelity per
  # vector, and NOT interchangeable with theirs. See the note in starter/lms.yaml.
  - model_name: unsloth-embed
    litellm_params:
      model: openai/second-state/Nomic-embed-text-v1.5-Embedding-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048              # context_length from Unsloth's GET /v1/status
