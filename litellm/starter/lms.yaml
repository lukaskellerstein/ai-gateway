# LMStudio (port 1234) — THE STARTER FRAGMENT. Two aliases: one chat model, one embedder.
#
# A FRAGMENT IS NOT A CONFIG. It carries `model_list` and nothing else, and LiteLLM never
# loads it directly. The composed files include it:
#
#   config.starter.lms.yaml   settings.yaml + this file
#   config.starter.all.yaml   settings.yaml + this file + the other two engines
#
# The settings blocks, the pricing rules and the timeout reasoning are in settings.yaml,
# once. This file holds what is true of LMSTUDIO and of these two models.
#
# THE SAME TWO MODELS EXIST ON ALL THREE ENGINES in this list — `unsloth-4b` / `ollama-4b`
# and `unsloth-embed` / `ollama-embed` — which is the whole point: one model, three engines,
# so you measure the engine by changing the alias and nothing else.
#
# LMSTUDIO MUST BE HAND-LOADED. It JIT-loads a model that is not resident, and a JIT load
# does NOT inherit hand-load flags — the model comes back at 8192 context with a 1 h TTL, so
# max_input_tokens below becomes a lie and a long prompt fails for no visible reason.
# `lms ps --json` is the truth, not the UI:
#   lms load google/gemma-4-e4b --context-length 131072 --parallel 1 --gpu max
# `--parallel 1` on purpose: an agent client fires its main turn and its background calls at
# once, and at --parallel 4 they split one GPU four ways.
#
# THE KEY IS ANY STRING. LMStudio never checks it, unlike Unsloth.

model_list:
  # Gemma 4 E4B — "effective" 4B. Its window is 131072, not the 262144 the larger Gemma
  # builds carry, which is where the 122880 below comes from (131072 − 8192 reserved for
  # the reply). Tools and vision both work: small here means few parameters, not a
  # cut-down feature set.
  #
  # It is also the one chat alias present in BOTH lists on BOTH gateways, which is why
  # tests/ defaults to it. Keep it that way or a fresh clone's first command fails.
  - model_name: lms-4b
    litellm_params:
      model: lm_studio/google/gemma-4-e4b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"              # LMStudio accepts any string
      input_cost_per_token: 0.00000012    # shadow price, so budget ceilings still trip
      output_cost_per_token: 0.00000035
      max_tokens: 4096                    # IT REASONS — 65 of 70 completion tokens on a
                                          # one-word prompt, 2026-08-28. 4096 clears that
                                          # comfortably; 20 returned empty content
      timeout: 3600                       # see the timeout note in settings.yaml
    model_info:
      max_input_tokens: 122880            # 131072 − the 8192 output reserve
      max_output_tokens: 8192

  # nomic-embed-text v1.5 at 768 dimensions, the Q4_K_M build at 84 MB.
  #
  # EMBEDDING VECTORS DO NOT MIX ACROSS MODELS OR BUILDS, AND ALL THREE EMBEDDERS HERE ARE A
  # DIFFERENT BUILD of that one model — this is Q4_K_M, `unsloth-embed` is Q8_0 at 146 MB,
  # `ollama-embed` is F16 at 274 MB (measured 2026-08-31, `lms ls --json` and `ollama show`).
  # Quantisation moves where a text lands in the space, so an index built with one alias and
  # queried with another returns quietly worse neighbours. Nothing errors. Record which alias
  # built each index, and do not treat any two of these as interchangeable.
  - model_name: lms-embed
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048
