# LiteLLM gateway. Call aliases, never model names: tiers local/cheap/standard/frontier,
# the on-GPU ladder local-31b/-12b/-4b/-3b/-2b plus local-qwen, the Unsloth twins
# unsloth-31b and unsloth-26b, and the roles embed, embed-hq, uncensored, reasoning and
# creative. cheap-free and standard-hf are fallback targets only — every local-* and
# unsloth-* name carries a suffix but is NOT one of those, it is a name to call.
#
# TWO local runtimes, not one. `local*` is LMStudio on port 1234, `unsloth*` is Unsloth
# Studio on 8888 — same GPU, same weights, different engine, so a caller can compare them
# by changing the alias and nothing else. They compete for the same GPU: loading a 31B in
# one does not evict the other's model, it just leaves less room. Read both `lms ps --json`
# and Unsloth's `GET /v1/status` before blaming a slow reply on the gateway.
#
# LMStudio routes assume a hand load at full context — a JIT load comes back at 8192 with
# a 1h TTL, and the max_input_tokens below are then a lie. `lms ps --json` is the truth:
#   lms load <model> --context-length 262144 --parallel 1 --gpu max
# 262144 for most; the three routes declaring 122880 input (local-4b, local-2b, creative)
# cap at 131072 instead. `lms ls --json` → maxContextLength is the per-model figure.
#
# `--parallel 1` on purpose. An agent client fires the main turn and its background calls
# (titles, summaries) at once; at --parallel 4 they split one GPU four ways and a 1-token
# request measured 34 s while big prompts sat behind it. Serialising is faster end to end.
#
# The 3600 s `timeout` on every LMStudio chat route is the same fact from the other
# side. Prompt processing on this machine measures ~100 tok/s (17.6k tokens in 173 s), so
# an agent-scale prompt needs 5-15 MINUTES before its first token and the full 253952-token
# window needs ~42. LiteLLM's 600 s default expires mid-prompt; LMStudio then reports
# `Engine protocol predict request failed: fetch failed` — its engine socket torn down, not
# a bad request — which maps to a 400, and a 400 is never retried. Raise this in step with
# the client's own timeout (API_TIMEOUT_MS for Claude Code, NOTES.md), or the client gives
# up first and the gateway's patience is wasted. Cloud routes keep the default on purpose:
# an hour is right for a local GPU grinding, wrong for a hung HTTP call to OpenRouter.
#
# Prices are stated explicitly because LiteLLM's cost map knows none of these models, and
# an unpriced route logs $0 — which makes a virtual key's budget ceiling a no-op.
#
# Several local routes have no hosted twin to mirror, so their shadow price reuses the
# nearest rate that IS sourced, rounded UP rather than down. A shadow price exists only to
# make ceilings trip: pricing a 3B at a 26B's rate burns a budget faster than reality,
# which is visible and correctable, while pricing it under reality silently disables the
# guardrail. Err in the direction you can see.
#
# No LMStudio route has a fallback chain. The reason is the one stated on `local-31b`
# below and it generalises: these names promise "these weights, on this machine, free", and
# a chain to a hosted model breaks that promise at the worst moment. `local` is the single
# deliberate exception.
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Local routes carry their cloud twin's rate so ceilings can trip. That is a SHADOW
  # cost, not money spent — anything summing /spend/logs must record the provider too.
  - model_name: local
    litellm_params:
      model: lm_studio/google/gemma-4-26b-a4b-qat
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: mirrors `cheap`
      output_cost_per_token: 0.00000035
      max_tokens: 4096                   # default, not a cap; guards runaway generations
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:                          # context − output reserve, on every route below
      max_input_tokens: 253952
      max_output_tokens: 8192

  # The dense 31B, unablated — `standard`'s exact weights, run here instead of at
  # OpenRouter. Slower than `local` (31B dense vs a 26B MoE with ~4B active: every token
  # goes through every parameter), so it is a name you pick deliberately, not a default.
  #
  # Absent from both fallback maps, but for a DIFFERENT reason than `uncensored` below:
  # the hosted twin would answer this one fine — it is `standard`. The point is that
  # `local-31b` should always mean "these weights, on this machine, free". A caller who
  # wants the cloud twin asks for `standard` and knows they are paying for it.
  # QAT — quantisation-aware trained, not quantised after the fact. The 4-bit error is
  # learned around during training rather than introduced at the end, so this sits closer
  # to full precision than its Q4_0 label suggests, and closer than the Q4_K_M build it
  # replaced despite Q4_K_M being the more elaborate scheme. It is also 1.04 GB smaller
  # (18.85 vs 19.89 GB) — real, but the lesser reason: at the 262144 context this route
  # assumes, the KV cache is identical between the two builds, so 1.04 GB is the whole
  # saving and it does not grow with the window.
  - model_name: local-31b
    litellm_params:
      model: lm_studio/google/gemma-4-31b-qat
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: mirrors `standard`, the hosted twin
      output_cost_per_token: 0.0000004
      max_tokens: 4096                   # shared with reasoning tokens; too low returns empty content
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # The rungs below `local-31b`. Same Gemma 4 family, same 262144 window, a fraction of the
  # weights — these are the names to reach for when the 31B's minutes-per-prompt cost more
  # than its extra quality is worth. This one is QAT too, for the reason given on
  # `local-31b` above.
  - model_name: local-12b
    litellm_params:
      model: lm_studio/google/gemma-4-12b-qat
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: no hosted twin, so `cheap`'s rate
      output_cost_per_token: 0.00000035  # stands in — see the shadow-price note above
      max_tokens: 4096                   # shared with reasoning tokens; too low returns empty content
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # 3 GB, so it loads in seconds and leaves most of the GPU free for something else. For
  # classification, routing, extraction and the other high-volume short calls where the
  # 26B's throughput is the constraint rather than its reasoning. Tools and vision, full
  # window — small here means few parameters, not a cut-down feature set.
  - model_name: local-3b
    litellm_params:
      model: lm_studio/mistralai/ministral-3-3b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: deliberately over-stated, as above
      output_cost_per_token: 0.00000035
      max_tokens: 4096
      timeout: 3600
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # The Gemma 4 E pair — "effective" 4B and 2B, and the only chat routes here whose window
  # is 131072 rather than 262144, which is why their numbers differ from every block above.
  #
  # On the two figures you would check first they lose to `local-3b`: e4b is 6.86 GB on disk
  # against Ministral's 2.99, e2b is 4.37 GB — LARGER than the 3B it nominally sits below —
  # and both carry half the context. They earn a name for the one thing Ministral cannot
  # give, which is a Gemma-family answer at this size. Reach for them when the question is
  # whether a prompt survives shrinking *within* the family the rest of this ladder uses;
  # reach for `local-3b` when you want a genuinely different vendor's opinion.
  - model_name: local-4b
    litellm_params:
      model: lm_studio/google/gemma-4-e4b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: no hosted twin, so `cheap`'s rate
      output_cost_per_token: 0.00000035  # stands in — see the shadow-price note above
      max_tokens: 4096                   # reasons on 4096, as `local-12b` does
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 122880           # 131072 − the same 8192 output reserve
      max_output_tokens: 8192

  - model_name: local-2b
    litellm_params:
      model: lm_studio/google/gemma-4-e2b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: deliberately over-stated, as above
      output_cost_per_token: 0.00000035
      max_tokens: 4096
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 122880           # 131072 − the same 8192 output reserve
      max_output_tokens: 8192

  # The non-Gemma opinion at the top of the ladder: Qwen3.8 27B, tool-trained and
  # vision-capable, on the same 262144 window as the Gemma routes.
  #
  # Named by family and not by rung, deliberately. `local-27b` would be the ladder-shaped
  # name and it would be ambiguous: `reasoning` below is *also* a 27B Qwen, so a size name
  # would describe two different routes equally well. The reason to reach for this one is
  # the family, so the family is what the name says.
  #
  # It emits a reasoning block like `reasoning` does, hence 8192 rather than 4096: asked for
  # 17×23 it spent 59 of 65 completion tokens thinking (verified 2026-08-23). On 4096 a real
  # prompt hits the cap mid-thought and returns empty content with no error at all.
  - model_name: local-qwen
    litellm_params:
      model: lm_studio/qwen/qwen3.8-27b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: nearest sourced rate, `standard`'s
      output_cost_per_token: 0.0000004   # (27B here against that 31B)
      max_tokens: 8192                   # reasoning + reply share this; see above
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # Abliterated weights. Absent from both fallback maps ON PURPOSE: a hosted twin would
  # refuse the request and would see prompts chosen to stay on this machine.
  - model_name: uncensored
    litellm_params:
      model: lm_studio/gemma-4-31b-it-abliterated
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: mirrors `standard`, the unablated model
      output_cost_per_token: 0.0000004
      max_tokens: 4096                   # shared with reasoning tokens; too low returns empty content
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # A role, not a rung: this one emits a reasoning block before its answer. `max_tokens` is
  # 8192 where every other chat route here carries 4096, because reasoning tokens are drawn
  # from the SAME allowance as the reply — a thinking model that hits the cap mid-thought
  # returns empty content and no error, which reads as a broken alias rather than a low cap.
  - model_name: reasoning
    litellm_params:
      model: lm_studio/thinkingcap-qwen3.6-27b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: nearest sourced rate, `standard`'s
      output_cost_per_token: 0.0000004   # (27B here against that 31B)
      max_tokens: 8192                   # reasoning + reply share this; see above
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  # A role: long-form prose at 28B, and the only non-Gemma, non-Qwen route here.
  #
  # It is the one model whose LMStudio metadata says tool use was never trained in
  # (`trainedForToolUse: false` in `lms ls --json`) — and yet a single-tool request returns
  # a proper structured tool_call, finish_reason `tool_calls`, verified 2026-08-23. Treat
  # the flag as a statement about training, not about the runtime: LMStudio applies its own
  # tool template regardless. What stays UNVERIFIED is whether that holds up under an agent
  # loop's many-tool, many-turn prompts, which is where an untrained model degrades to
  # raw-text tool syntax — the silent failure that empties an agent run. Prose is what this
  # alias is for; if you drive an agent with it, confirm tool_calls on that workload first.
  #
  # Its window is 131072, half what the Gemma routes carry, which is why the numbers below
  # differ from every other block: 131072 − the same 8192 output reserve.
  - model_name: creative
    litellm_params:
      model: lm_studio/meta/muse-glimmer
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: nearest sourced rate, `standard`'s
      output_cost_per_token: 0.0000004
      max_tokens: 8192                   # it reasons AND writes long-form; 4096 is where
                                         # those two together start truncating the prose
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 122880
      max_output_tokens: 8192

  # ---------------------------------------------------------------------------
  # Unsloth Studio — the SECOND local runtime, same GPU, same weights, different
  # engine. `unsloth-31b` is `local-31b`'s twin and `unsloth-26b` is `local`'s,
  # so a caller can put the two engines side by side without changing anything
  # but the alias. That comparison is the only reason these exist.
  #
  # Four differences from every LMStudio route above, each of which has bitten:
  #
  # 1. THE PREFIX IS `openai/`, NOT `unsloth/`. LiteLLM has no Unsloth provider.
  #    A provider prefix here means "speaks the OpenAI protocol", and api_base is
  #    the only thing separating this from api.openai.com — the same reasoning
  #    seed_gateway.py's PROVIDERS map already applies to `lm_studio`.
  # 2. THE MODEL ID CARRIES A SLASH: `unsloth/gemma-4-31B-it-qat-GGUF` is the
  #    HuggingFace repo id, and it is what `GET /v1/models` returns. So the full
  #    string below has TWO slashes and only the first one is the provider.
  # 3. IT NEEDS A KEY. LMStudio takes any string; Unsloth answers `401 Not
  #    authenticated` on every route, `/v1/models` included. The key is personal,
  #    so it arrives from the shell and .env stays blank.
  # 4. NOTHING LOADS ON DEMAND UNLESS AUTO-SWITCH IS ON. Unsloth serves ONE model
  #    at a time. With `Settings > API > Model auto-switch` off, a request for a
  #    model that is not loaded returns 400 `No model loaded` — it does not queue
  #    and it does not load. With it on, a call to one of these two aliases
  #    UNLOADS the other and reads ~18 GB from disk first. That is why the
  #    timeout below matters as much as it does on the LMStudio routes.
  #
# 5. THE SAME WEIGHTS THINK HERE AND DO NOT THINK IN LMSTUDIO. Verified
  #    2026-08-27: `unsloth-26b` returns a `reasoning_content` block that `local`
  #    — the identical gemma-4-26b-a4b-qat — does not. Unsloth reports the model
  #    as `supports_reasoning: true, reasoning_style: enable_thinking` and turns
  #    it on; LMStudio does not. So BOTH routes below carry `max_tokens: 8192`
  #    like `reasoning` and `local-qwen`, not the 4096 their LMStudio twins use.
  #    At 60 tokens the reply was empty with `finish_reason: length` and the whole
  #    budget spent thinking; at 1000 it answered in 117. That empty content is
  #    the failure this number exists to prevent, and it raises no error.
  #
  # No fallback chain, for the reason stated on `local-31b`: these names promise
  # "these weights, this engine, on this machine, free". A hop to a hosted model
  # would break exactly the comparison the aliases exist to make.
  - model_name: unsloth-31b
    litellm_params:
      model: openai/unsloth/gemma-4-31B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000014   # shadow price: mirrors `standard`, as `local-31b` does
      output_cost_per_token: 0.0000004   # — same weights, so the same rate
      max_tokens: 8192                   # reasoning + reply share this; see note 5 above
      timeout: 3600                      # see the LMStudio timeout note in the header; a cold
                                         # auto-switch load adds ~17 GB of disk read on top
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192
      mlflow_secret_name: unsloth        # see seed_gateway.py; without it the MLflow secret
                                         # holding an Unsloth key would be named "openai"

  - model_name: unsloth-26b
    litellm_params:
      model: openai/unsloth/gemma-4-26B-A4B-it-qat-GGUF
      api_base: os.environ/UNSLOTH_API_BASE
      api_key: os.environ/UNSLOTH_API_KEY
      input_cost_per_token: 0.00000012   # shadow price: mirrors `cheap`, as `local` does
      output_cost_per_token: 0.00000035
      max_tokens: 8192                   # reasoning + reply share this; see note 5 above
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      # 262144 − the 8192 output reserve, read from Unsloth's own GET /v1/status
      # with the model loaded (context_length 262144), not copied from the twin.
      max_input_tokens: 253952
      max_output_tokens: 8192
      mlflow_secret_name: unsloth

  - model_name: embed
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048

  # The same nomic model as `embed`, built at Q8_0 instead of Q4_K_M: 146 MB against 84 MB,
  # the same 2048 window, more fidelity per vector. Both are free and both load in under a
  # second, so the choice is purely accuracy against memory.
  #
  # VECTORS FROM THE TWO ARE NOT INTERCHANGEABLE, and this is the only way to get it wrong.
  # Quantisation moves where a text lands in the space, so a query embedded here and matched
  # against an index built with `embed` returns subtly worse neighbours — nothing errors,
  # the results are just quietly less relevant, which is close to undetectable after the
  # fact. Pick ONE alias per index, and record which one alongside the index.
  - model_name: embed-hq
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5-embedding
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048

  # - model_name: cheap                     # $0.12 / $0.35 per 1M tokens
  #   litellm_params:
  #     model: openrouter/google/gemma-4-26b-a4b-it
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     input_cost_per_token: 0.00000012
  #     output_cost_per_token: 0.00000035
  #     max_tokens: 4096
  #     extra_body:
  #       provider:
  #         require_parameters: true        # skip OpenRouter providers that can't do tools
  #   model_info:
  #     max_input_tokens: 245760
  #     max_output_tokens: 16384

  # - model_name: standard                  # $0.14 / $0.40 per 1M tokens
  #   litellm_params:
  #     model: openrouter/google/gemma-4-31b-it
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     input_cost_per_token: 0.00000014
  #     output_cost_per_token: 0.0000004
  #     max_tokens: 4096
  #     extra_body:
  #       provider:
  #         require_parameters: true
  #   model_info:
  #     max_input_tokens: 245760
  #     max_output_tokens: 16384
  #
  # - model_name: frontier                  # unpriced here: already in LiteLLM's cost map
  #   litellm_params:
  #     model: openai/gpt-5.4-mini
  #     api_key: os.environ/OPENAI_API_KEY
  #
  # - model_name: cheap-free
  #   litellm_params:
  #     model: openrouter/google/gemma-4-26b-a4b-it:free
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     input_cost_per_token: 0
  #     output_cost_per_token: 0
  #     max_tokens: 4096
  #     extra_body:
  #       provider:
  #         require_parameters: true
  #         # LOAD-BEARING FOR AGENT RUNS. The other free-tier provider advertises tools but
  #         # returns raw-text tool calls under agent-scale prompts — nothing errors, the
  #         # agent just executes nothing. Must fail over to the paid twin, never sideways.
  #         order: ["google-ai-studio"]
  #         allow_fallbacks: false
  #   model_info:
  #     max_input_tokens: 229376
  #     max_output_tokens: 32768
  #
  # - model_name: standard-hf               # $0.14 / $0.40 per 1M (Novita's catalog)
  #   litellm_params:
  #     model: huggingface/novita/google/gemma-4-31B-it
  #     api_key: os.environ/HF_TOKEN
  #     input_cost_per_token: 0.00000014
  #     output_cost_per_token: 0.0000004
  #     max_tokens: 4096

litellm_settings:
  success_callback: []                    # tracing is a project's job, not the gateway's
  drop_params: true
  turn_off_message_logging: false         # pinned: either one flipped empties every stored request
  redact_messages_in_exceptions: false

  # # On error. `local` leads to its own cloud twin, so the common hop changes where a
  # # request ran, not what ran — but it reaches a PRICED route, so budget the key.
  # # `local-31b`, `uncensored` and `embed` are absent by design, not by oversight — the
  # # reason differs per alias and is stated above each one.
  # fallbacks:
  #   - {"local": ["cheap-free", "cheap"]}
  #   - {"cheap-free": ["cheap"]}
  #   - {"cheap": ["standard", "frontier"]}
  #   - {"standard": ["standard-hf", "frontier"]}
  #   - {"frontier": ["standard"]}
  #
  # # On overflow. Short because `frontier` is the only larger window here.
  # context_window_fallbacks:
  #   - {"local": ["frontier"]}
  #   - {"cheap-free": ["frontier"]}
  #   - {"cheap": ["frontier"]}
  #   - {"standard": ["frontier"]}

router_settings:
  enable_pre_call_checks: true            # off (the default), every max_input_tokens above is inert

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Needs DATABASE_URL. The prompt lands in the `proxy_server_request` column, NOT in
  # `messages` — that one looks obvious and stays "{}" for chat completions.
  store_prompts_in_spend_logs: true
