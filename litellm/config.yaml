# LiteLLM gateway. Call aliases, never model names: tiers local/cheap/standard/frontier,
# roles embed + uncensored. cheap-free and standard-hf are fallback targets only.
#
# LMStudio routes assume a hand load at full context — a JIT load comes back at 8192 with
# a 1h TTL, and the max_input_tokens below are then a lie. `lms ps --json` is the truth:
#   lms load <model> --context-length 262144 --parallel 1 --gpu max
#
# `--parallel 1` on purpose. An agent client fires the main turn and its background calls
# (titles, summaries) at once; at --parallel 4 they split one GPU four ways and a 1-token
# request measured 34 s while big prompts sat behind it. Serialising is faster end to end.
#
# The 3600 s `timeout` on the two LMStudio chat routes is the same fact from the other
# side. Prompt processing on this machine measures ~100 tok/s (17.6k tokens in 173 s), so
# an agent-scale prompt needs 5-15 MINUTES before its first token and the full 253952-token
# window needs ~42. LiteLLM's 600 s default expires mid-prompt; LMStudio then reports
# `Engine protocol predict request failed: fetch failed` — its engine socket torn down, not
# a bad request — which maps to a 400, and a 400 is never retried. Raise this in step with
# the client's own timeout (API_TIMEOUT_MS for Claude Code, NOTES.md), or the client gives
# up first and the gateway's patience is wasted. Cloud routes keep the default on purpose:
# an hour is right for a local GPU grinding, wrong for a hung HTTP call to OpenRouter.
#
# Prices are stated explicitly because LiteLLM's cost map knows none of these models, and
# an unpriced route logs $0 — which makes a virtual key's budget ceiling a no-op.
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Local routes carry their cloud twin's rate so ceilings can trip. That is a SHADOW
  # cost, not money spent — anything summing /spend/logs must record the provider too.
  - model_name: local
    litellm_params:
      model: lm_studio/google/gemma-4-26b-a4b
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000012   # shadow price: mirrors `cheap`
      output_cost_per_token: 0.00000035
      max_tokens: 4096                   # default, not a cap; guards runaway generations
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:                          # context − output reserve, on every route below
      max_input_tokens: 253952
      max_output_tokens: 8192

  # Abliterated weights. Absent from both fallback maps ON PURPOSE: a hosted twin would
  # refuse the request and would see prompts chosen to stay on this machine.
  - model_name: uncensored
    litellm_params:
      model: lm_studio/gemma-4-31b-it-abliterated
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0.00000014   # shadow price: mirrors `standard`, the unablated model
      output_cost_per_token: 0.0000004
      max_tokens: 4096                   # shared with reasoning tokens; too low returns empty content
      timeout: 3600                      # see the LMStudio timeout note in the header
    model_info:
      max_input_tokens: 253952
      max_output_tokens: 8192

  - model_name: embed
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5
      api_base: os.environ/LM_STUDIO_API_BASE
      api_key: "sk-lmstudio"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048

  - model_name: cheap                     # $0.12 / $0.35 per 1M tokens
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000012
      output_cost_per_token: 0.00000035
      max_tokens: 4096
      extra_body:
        provider:
          require_parameters: true        # skip OpenRouter providers that can't do tools
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384

  - model_name: standard                  # $0.14 / $0.40 per 1M tokens
    litellm_params:
      model: openrouter/google/gemma-4-31b-it
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.0000004
      max_tokens: 4096
      extra_body:
        provider:
          require_parameters: true
    model_info:
      max_input_tokens: 245760
      max_output_tokens: 16384

  - model_name: frontier                  # unpriced here: already in LiteLLM's cost map
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: cheap-free
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_tokens: 4096
      extra_body:
        provider:
          require_parameters: true
          # LOAD-BEARING FOR AGENT RUNS. The other free-tier provider advertises tools but
          # returns raw-text tool calls under agent-scale prompts — nothing errors, the
          # agent just executes nothing. Must fail over to the paid twin, never sideways.
          order: ["google-ai-studio"]
          allow_fallbacks: false
    model_info:
      max_input_tokens: 229376
      max_output_tokens: 32768

  - model_name: standard-hf               # $0.14 / $0.40 per 1M (Novita's catalog)
    litellm_params:
      model: huggingface/novita/google/gemma-4-31B-it
      api_key: os.environ/HF_TOKEN
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.0000004
      max_tokens: 4096

litellm_settings:
  success_callback: []                    # tracing is a project's job, not the gateway's
  drop_params: true
  turn_off_message_logging: false         # pinned: either one flipped empties every stored request
  redact_messages_in_exceptions: false

  # On error. `local` leads to its own cloud twin, so the common hop changes where a
  # request ran, not what ran — but it reaches a PRICED route, so budget the key.
  # `uncensored` and `embed` are absent by design, not by oversight.
  fallbacks:
    - {"local": ["cheap-free", "cheap"]}
    - {"cheap-free": ["cheap"]}
    - {"cheap": ["standard", "frontier"]}
    - {"standard": ["standard-hf", "frontier"]}
    - {"frontier": ["standard"]}

  # On overflow. Short because `frontier` is the only larger window here.
  context_window_fallbacks:
    - {"local": ["frontier"]}
    - {"cheap-free": ["frontier"]}
    - {"cheap": ["frontier"]}
    - {"standard": ["frontier"]}

router_settings:
  enable_pre_call_checks: true            # off (the default), every max_input_tokens above is inert

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Needs DATABASE_URL. The prompt lands in the `proxy_server_request` column, NOT in
  # `messages` — that one looks obvious and stays "{}" for chat completions.
  store_prompts_in_spend_logs: true
