# Ollama (port 11434) — THE FULL FRAGMENT. Four aliases: three chat, one embedder.
#
# A FRAGMENT IS NOT A CONFIG. It carries `model_list` and nothing else; the composed files
# `config.full.ollama.yaml` and `config.full.all.yaml` include it alongside settings.yaml,
# which holds the settings blocks, the pricing rules and the timeout note.
#
# THE THIRD LOCAL ENGINE. `ollama-31b` and `ollama-26b` complete the pair the `unsloth-*`
# aliases started: one model, three engines, so lms-31b / unsloth-31b / ollama-31b differ in
# the engine and nothing else. That three-way comparison is the only reason these exist.
#
# SIX differences from the other two engines, each of which has bitten or would:
#
# 1. THE PREFIX IS `openai/`, NOT `ollama/`, AND THAT IS A CHOICE. LiteLLM DOES ship an
#    `ollama_chat` provider. It is not used because Ollama's /v1 layer is already
#    OpenAI-compatible and returns structured tool_calls (verified 2026-08-27), so the
#    native prefix buys nothing while `openai/` keeps these routes shaped exactly like the
#    `unsloth-*` ones. Switching is a real option; it is a separate change and needs its own
#    tool-calling test.
# 2. THE MODEL ID CARRIES A COLON, not a slash: `gemma4:31b`. So unlike the Unsloth ids
#    there is exactly ONE slash below, and it is the provider.
# 3. IT IGNORES THE KEY, and one is set anyway. Ollama does not read Authorization at all.
#    `sk-ollama` is here because LiteLLM's `openai/` provider needs SOME key string — with
#    none it falls back to OPENAI_API_KEY, which is blank, and the route errors before it
#    reaches Ollama.
# 4. IT LOADS ON DEMAND AND HOLDS SEVERAL MODELS AT ONCE — the opposite of Unsloth's
#    one-at-a-time swap, and it needs no auto-switch setting. The cost moves to the first
#    call on a cold model, which reads ~19 GB from disk before its first token; that is what
#    the timeout covers. Ollama then evicts a model after 5 minutes idle by default, so the
#    SECOND call of a session can be as slow as the first. `ollama ps` is the truth about
#    what is resident — not `ollama list`, which only says what is on disk.
# 5. IT THINKS ON WEIGHTS ITS LMSTUDIO TWIN DOES NOT. Verified 2026-08-27: `/api/show`
#    reports `thinking` in capabilities and Ollama turns it on. At max_tokens 60 the reply
#    came back EMPTY with finish_reason `length`, the whole budget spent in the
#    `reasoning_content` field. So every chat route below carries max_tokens 8192, not the
#    4096 its LMStudio twin uses. Again: this is per MODEL, not per engine — see note 3 in
#    settings.yaml.
# 6. THE BUILD IS NOT ITS TWINS' BUILD. LMStudio and Unsloth both run QAT weights; these
#    tags are Q4_K_M, quantised AFTER training. Ollama's library does carry
#    `gemma4:31b-it-qat` and `gemma4:26b-a4b-it-qat` and they are not what is pulled here.
#    So an ollama-31b vs lms-31b difference measures ENGINE AND QUANTISATION TOGETHER. Say
#    which you are claiming when you report such a comparison, or pull the -it-qat tags.
#
# Pull what this file names before calling it:
#   ollama pull gemma4:31b && ollama pull gemma4:26b
#   ollama pull gemma4:e4b && ollama pull nomic-embed-text
#
# Every context figure below is read from Ollama's own GET /api/show
# (`gemma4.context_length`) with the model pulled, not copied from a twin.

model_list:
  - model_name: ollama-31b
    litellm_params:
      model: openai/gemma4:31b
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"               # ignored by Ollama; see note 3 above
      input_cost_per_token: 0.00000014   # shadow price: mirrors `standard`, as `lms-31b`
      output_cost_per_token: 0.0000004   # and `unsloth-31b` do — same weights, same rate
      max_tokens: 8192                   # reasoning + reply share this; see note 5 above
      timeout: 3600                      # see the timeout note in settings.yaml; a cold
                                         # load adds ~20 GB of disk read on top
    model_info:
      max_input_tokens: 253952           # 262144 − the same 8192 output reserve
      max_output_tokens: 8192

  - model_name: ollama-26b
    litellm_params:
      model: openai/gemma4:26b
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"
      input_cost_per_token: 0.00000012   # shadow price: mirrors `cheap`, as `lms-26b` and
      output_cost_per_token: 0.00000035  # `unsloth-26b` do
      max_tokens: 8192                   # reasoning + reply share this; see note 5 above
      timeout: 3600
    model_info:
      max_input_tokens: 253952           # 262144 − the same 8192 output reserve
      max_output_tokens: 8192

  # `lms-4b`'s twin, and the third leg of the E4B row. Its window is 131072 like `lms-4b`'s,
  # which is why these numbers differ from the two blocks above.
  #
  # `gemma4:latest` is the SAME model — one digest, c6eb396dbd59, two tags. The explicit
  # `:e4b` is used because `latest` moves on the next `ollama pull` and would change what
  # this alias means with nothing here edited.
  - model_name: ollama-4b
    litellm_params:
      model: openai/gemma4:e4b
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"
      input_cost_per_token: 0.00000012   # shadow price: no hosted twin, so `cheap`'s rate
      output_cost_per_token: 0.00000035
      max_tokens: 8192                   # reasoning + reply share this; see note 5 above
      timeout: 3600
    model_info:
      max_input_tokens: 122880           # 131072 − the same 8192 output reserve
      max_output_tokens: 8192

  # The embedding role on the third engine: the same MODEL as `lms-embed` and
  # `unsloth-embed` — nomic-embed-text v1.5 at 768 dimensions on a 2048 window, verified
  # 2026-08-27 from GET /api/show (nomic-bert.context_length 2048,
  # nomic-bert.embedding_length 768) and a live call.
  #
  # IT IS NOT A TWIN OF EITHER, BECAUSE THE BUILD DIFFERS. Measured 2026-08-31: this is F16
  # at 274 MB, `lms-embed` is Q4_K_M at 84 MB, `lms-embed-hq` and `unsloth-embed` are Q8_0 at
  # 146 MB. So the embedding row compares three engines on one model at THREE different
  # quantisations — unlike the chat rows, where `lms-4b` and `unsloth-4b` are both QAT and
  # isolate the engine cleanly. The pair that isolates the engine here is
  # `lms-embed-hq` against `unsloth-embed`; this alias is never one half of it.
  #
  # It replaced all-MiniLM-L6-v2 (384 dims, 512 window) on 2026-08-27. That was a different
  # model, so it could only ever measure "a different embedder", never the engine — and its
  # 512-token window silently dropped anything longer. Put it back as a separate alias if
  # you want the small one; do not put it back under this name.
  #
  # No tag is pinned here: `nomic-embed-text` resolves to :latest, which has been v1.5 for a
  # long time but is not guaranteed to stay. Pin `nomic-embed-text:v1.5` if reproducibility
  # of the VECTORS matters — a moved tag re-embeds differently and silently invalidates an
  # index built with the old one.
  - model_name: ollama-embed
    litellm_params:
      model: openai/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE
      api_key: "sk-ollama"
      input_cost_per_token: 0             # free, stated so it cannot read as unpriced
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 2048              # nomic-bert.context_length from GET /api/show
