# COMPOSED CONFIG — the FULL list, OLLAMA only. Four aliases, about 40 GB of models.
#
#   chat     ollama-31b  ollama-26b  ollama-4b
#   embed    ollama-embed
#
# compose loads exactly ONE file from this directory, and its name is two words from `.env`:
#
#   config.${GATEWAY_MODELS:-starter}.${GATEWAY_ENGINE:-all}.yaml
#
# so this file is what you get from:
#
#   GATEWAY_MODELS=full
#   GATEWAY_ENGINE=ollama
#
# NOTHING IS DECLARED HERE. The aliases are in full/ollama.yaml and the settings blocks are
# in settings.yaml; this file only names them. Edit those, not this one.
#
# Pull the four models first:
#   ollama pull gemma4:31b && ollama pull gemma4:26b
#   ollama pull gemma4:e4b && ollama pull nomic-embed-text

include:
  - settings.yaml
  - full/ollama.yaml
