# COMPOSED CONFIG — the FULL list on ALL THREE ENGINES. Twenty aliases, about 90 GB.
#
#   LMStudio   lms-31b lms-26b lms-12b lms-4b lms-3b lms-2b lms-qwen lms-uncensored
#              lms-reasoning lms-creative lms-embed lms-embed-hq
#   Unsloth    unsloth-31b unsloth-26b unsloth-4b unsloth-embed
#   Ollama     ollama-31b ollama-26b ollama-4b ollama-embed
#
# compose loads exactly ONE file from this directory, and its name is two words from `.env`:
#
#   config.${GATEWAY_MODELS:-starter}.${GATEWAY_ENGINE:-all}.yaml
#
# so this file is what you get from:
#
#   GATEWAY_MODELS=full
#   GATEWAY_ENGINE=all            # or leave it out — all is the default
#
# THIS IS THE ONLY FILE WHERE THE THREE-WAY COMPARISON EXISTS. lms-31b / unsloth-31b /
# ollama-31b are the same weights on three engines, and lms-4b / unsloth-4b / ollama-4b are
# the other row. Name a single engine and you keep that engine's aliases and lose the
# comparison — which is the right trade when you only have one engine installed.
#
# It is a STRICT SUPERSET of the starter list: everything in config.starter.all.yaml is
# here, with fourteen more names. Anything added to a starter fragment must also exist in
# the matching full fragment.
#
# NOTHING IS DECLARED HERE. The aliases are in the three fragments below and the settings
# blocks are in settings.yaml. Edit those, not this one.

include:
  - settings.yaml
  - full/lms.yaml
  - full/unsloth.yaml
  - full/ollama.yaml
