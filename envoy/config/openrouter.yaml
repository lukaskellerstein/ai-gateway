# OpenRouter — 1 alias. PAID: EVERY CALL BILLS A REAL ACCOUNT.
#
#   openrouter-26b   google/gemma-4-26b-a4b-it   $0.07 in / $0.34 out per 1M
#
# The same weights as `lms-26b` and `unsloth-26b`, on hardware you do not own.
# Selecting this engine is the only way this gateway can spend money, and there
# is no fallback anywhere here — a request costs money only when a caller names
# a route that costs money.
#
# `openrouter-free` IS DELIBERATELY ABSENT, and it is the one alias this gateway
# does not carry. That route needs a PROVIDER PIN
# (`order: ["google-ai-studio"]`, `allow_fallbacks: false`) because OpenRouter
# load-balances its free tier and one provider returns tool calls as RAW TEXT
# with `tool_calls` absent — an agent then executes nothing and reports no error.
# ../../litellm carries that pin in `extra_body`. This gateway has no equivalent
# way to put a vendor-specific object into the request body, so the alias is
# absent rather than present and unpinned.
#
# REQUIRES OPENROUTER_API_KEY in the shell. A blank value substitutes empty and
# every call 401s.
#
# THE SHAPE OF THIS FILE IS KUBERNETES CUSTOM RESOURCES, even though there is no
# Kubernetes anywhere. `aigw run` reads the same API the Envoy AI Gateway
# controller reads in a cluster, translates it in-process, and starts a real
# Envoy with it. config/lms.yaml carries the full note on the seven resources.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigw-run
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aigw-run
  namespace: default
spec:
  gatewayClassName: aigw-run
  listeners:
    - name: http
      protocol: HTTP
      # 1975 INSIDE the container; compose publishes it on 26000.
      port: 1975
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway
  namespace: default
spec:
  logging:
    level:
      # Raise to `debug` and Envoy dumps request headers, INCLUDING the
      # Authorization header the extproc injects with the backend key.
      default: error
  telemetry:
    accessLog:
      settings:
        # One JSON line per LLM request, carrying TOKEN COUNTS AND TIMINGS ONLY —
        # never the prompt or the response.
        #
        # IT ONLY REACHES `compose logs` WHEN AIGW_DEBUG=true. Envoy runs as a
        # child of aigw, and with debug off its stdout goes to a file inside the
        # container (~/.local/state/aigw/envoy-runs/0/stdout.log) that no shell
        # can reach — the image is distroless. Verified 2026-09-04: a call with
        # AIGW_DEBUG unset logged nothing; the same call with it true logged
        # `{"gen_ai.request.model":"ollama-4b", ... "response_code":200}`.
        #
        # AIGW_DEBUG=true ALSO DUMPS FULL REQUEST AND RESPONSE BODIES — prompts
        # and replies included, with only the Authorization header redacted. That
        # is the closest thing here to LiteLLM's Logs tab, and the reason not to
        # leave it on.
        - matches:
            - "request.headers['x-ai-eg-model'] != ''"
          sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              gen_ai.request.model: "%REQ(X-AI-EG-MODEL)%"
              gen_ai.response.model: "%DYNAMIC_METADATA(io.envoy.ai_gateway:response_model)%"
              gen_ai.provider.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:backend_name)%"
              gen_ai.usage.input_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              gen_ai.usage.output_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              gen_ai.usage.reasoning_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_reasoning_token)%"
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              request.path: "%REQ(:PATH)%"
              response_code: "%RESPONSE_CODE%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: aigw-run
  namespace: default
spec:
  parentRefs:
    - name: aigw-run
      kind: Gateway
      group: gateway.networking.k8s.io
  # THE ALIAS LIST. One rule per alias, matched EXACTLY on `x-ai-eg-model` —
  # which the gateway fills in from the request body's `model` field before
  # routing. `modelNameOverride` is what actually goes upstream, so the caller
  # says the alias and the engine sees its own model id.
  #
  # AN UNKNOWN ALIAS MATCHES NO RULE AND GETS 404 (verified 2026-09-04), which is
  # what every other engine's names do here — correctly, one engine at a time.
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: openrouter-26b
      backendRefs:
        - name: openrouter
          modelNameOverride: google/gemma-4-26b-a4b-it
      timeouts:
        request: 10m
    # ── The `-anthropic` alias: PASS-THROUGH, because OpenRouter serves it ────
    #
    # OPENROUTER SPEAKS THE ANTHROPIC MESSAGES API NATIVELY, at
    # `POST /api/v1/messages` — it calls it the "Anthropic skin", and it carries
    # thinking blocks, tool use, streaming and multi-turn context the way Anthropic
    # does. So this alias gets the SAME treatment as the three local engines: a
    # second `AIServiceBackend` whose schema is `Anthropic`, reached through the
    # same `Backend`, with the body going upstream UNTRANSLATED.
    #
    # It is the better of the two shapes and it is not always available — the
    # `openai-mini-anthropic` rule in openai.yaml has to translate instead, because
    # api.openai.com serves no Anthropic route at all. Both satisfy
    # `tests/5_claude_agent_sdk`, which resolves `<alias>-anthropic` at runtime.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: openrouter-26b-anthropic
      backendRefs:
        - name: openrouter-anthropic
          modelNameOverride: google/gemma-4-26b-a4b-it
      timeouts:
        request: 10m
  # What lands in the access log above. Without these the token fields are empty.
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_reasoning_token
      type: ReasoningToken
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter
  namespace: default
spec:
  endpoints:
    # OpenRouter, over the public internet. TLS, so a BackendTLSPolicy below.
    #
    # HOSTNAME AND PORT ARE SEPARATE FIELDS HERE, which is why this project has
    # no equivalent of ../../litellm's *_API_BASE: there is no URL to put in one
    # variable. Change the port here.
    - fqdn:
        hostname: openrouter.ai
        port: 443
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: default
spec:
  timeouts:
    # The per-BACKEND ceiling, separate from the per-ROUTE one above. Both have
    # to be raised: whichever is smaller wins, and upstream's default here is 3m.
    request: 10m
  schema:
    # `OpenAI` is a PROTOCOL, not a company. `prefix` defaults to /v1.
    name: OpenAI
    # The backend serves the OpenAI API under this path, not at the root.
    prefix: /api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter-anthropic
  namespace: default
spec:
  timeouts:
    request: 10m
  schema:
    # ONE `Backend` CARRIES BOTH OF THESE. The schema is what each one MEANS by the
    # bytes it forwards: `Anthropic` here, so /anthropic/v1/messages goes upstream as
    # it arrived and OpenRouter's own Anthropic skin answers it.
    name: Anthropic
    # Same as the OpenAI one — OpenRouter serves its APIs under /api/v1, not at the
    # root, so /api/v1/messages is where this lands.
    prefix: /api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigw-run
  connection:
    # ENVOY'S DEFAULT IS 32 KiB AND THAT IS TOO SMALL FOR AI TRAFFIC. A base64
    # image or a long agent transcript exceeds it and the request fails before
    # it reaches the model.
    bufferLimit: 50Mi
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: openrouter-tls
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: openrouter
  validation:
    # WITHOUT THIS the connection is plain HTTP to port 443 and every call fails
    # with an upstream connect error. The three local engines need no such policy.
    wellKnownCACertificates: "System"
    hostname: openrouter.ai
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-apikey
  namespace: default
type: Opaque
stringData:
  # From the shell. REAL SPEND.
  apiKey: ${OPENROUTER_API_KEY}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openrouter-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openrouter
    # THE SECOND BACKEND NEEDS THE KEY TOO. Miss this and the `-anthropic` alias
    # reaches OpenRouter with no Authorization header and gets 401, while the plain
    # alias beside it works — which reads as a broken alias, not a missing target.
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openrouter-anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: openrouter-apikey
