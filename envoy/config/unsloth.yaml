# Unsloth Studio, on this machine — 7 aliases, free.
#
#   unsloth-gemma4-e4b    unsloth/gemma-4-E4B-it-qat-GGUF                     chat
#   unsloth-gemma4-12b    lmstudio-community/gemma-4-12B-it-QAT-GGUF          chat, 12B dense, Q4_0
#   unsloth-gemma4-26b    unsloth/gemma-4-26B-A4B-it-qat-GGUF                 chat, 26B MoE
#   unsloth-gemma4-26b-fast  the same file, thinking OFF                      chat, the fast route
#   unsloth-qwen38-27b    unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL                 chat, 27B dense, Q8
#   unsloth-nomic-embed   second-state/Nomic-embed-text-v1.5-Embedding-GGUF   embeddings
#   unsloth-nomic-embed-sidecar  nomic-ai/nomic-embed-text-v1.5          embeddings, beside chat
#
# The same weights as the `lms-*` routes, on a different engine — that is the
# point of the naming, and the reason ../tests can measure one against the other.
#
# UNSLOTH IS THE ONE ENGINE THAT NEEDS A KEY. Every route answers `401 Not
# authenticated` without it, /v1/models included. It arrives from the shell
# (~/Projects/.envrc) and reaches the Secret below through ${UNSLOTH_API_KEY},
# which aigw substitutes before parsing this file. A BLANK VALUE SUBSTITUTES
# EMPTY and every call here 401s at request time.
#
# A GATEWAY CALL SWAPS ONE ACTIVE MODEL, chat and embedder alike. `unsloth-nomic-embed`
# evicts `unsloth-gemma4-26b` and the next chat call swaps it back — 13-17 s. Two gateways
# pointed at Unsloth at once will thrash it. TWO EXCEPTIONS: a model pre-loaded in Studio
# with `Keep other models loaded` stays beside the active one and answers with no reload
# (Studio v0.1.903-beta, measured 2026-10-07) — no gateway call can load one that way; and
# Studio's own `Settings -> embedding model` runs in its own process beside the chat model,
# so `unsloth-nomic-embed-sidecar` evicts nothing while that setting names its exact id
# (measured 2026-10-03). ../../litellm/config/unsloth.yaml has the numbers for both.
#
# `Settings -> API -> Model auto-switch` MUST BE ON, or the first call to a model
# that is not resident returns `400 No model loaded`.
#
# THE SHAPE OF THIS FILE IS KUBERNETES CUSTOM RESOURCES, even though there is no
# Kubernetes anywhere. `aigw run` reads the same API the Envoy AI Gateway
# controller reads in a cluster, translates it in-process, and starts a real
# Envoy with it. config/lms.yaml carries the full note on the seven resources.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigw-run
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aigw-run
  namespace: default
spec:
  gatewayClassName: aigw-run
  listeners:
    - name: http
      protocol: HTTP
      # 1975 INSIDE the container; compose publishes it on 26000.
      port: 1975
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway
  namespace: default
spec:
  logging:
    level:
      # Raise to `debug` and Envoy dumps request headers, INCLUDING the
      # Authorization header the extproc injects with the backend key.
      default: error
  telemetry:
    accessLog:
      settings:
        # One JSON line per LLM request, carrying TOKEN COUNTS AND TIMINGS ONLY —
        # never the prompt or the response.
        #
        # IT ONLY REACHES `compose logs` WHEN AIGW_DEBUG=true. Envoy runs as a
        # child of aigw, and with debug off its stdout goes to a file inside the
        # container (~/.local/state/aigw/envoy-runs/0/stdout.log) that no shell
        # can reach — the image is distroless. Verified 2026-09-04: a call with
        # AIGW_DEBUG unset logged nothing; the same call with it true logged
        # `{"gen_ai.request.model":"ollama-gemma4-e4b", ... "response_code":200}`.
        #
        # AIGW_DEBUG=true ALSO DUMPS FULL REQUEST AND RESPONSE BODIES — prompts
        # and replies included, with only the Authorization header redacted. That
        # is the closest thing here to LiteLLM's Logs tab, and the reason not to
        # leave it on.
        - matches:
            - "request.headers['x-ai-eg-model'] != ''"
          sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              gen_ai.request.model: "%REQ(X-AI-EG-MODEL)%"
              gen_ai.response.model: "%DYNAMIC_METADATA(io.envoy.ai_gateway:response_model)%"
              gen_ai.provider.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:backend_name)%"
              gen_ai.usage.input_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_input_token)%"
              gen_ai.usage.output_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_output_token)%"
              gen_ai.usage.reasoning_tokens: "%DYNAMIC_METADATA(io.envoy.ai_gateway:llm_reasoning_token)%"
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              request.path: "%REQ(:PATH)%"
              response_code: "%RESPONSE_CODE%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: aigw-run
  namespace: default
spec:
  parentRefs:
    - name: aigw-run
      kind: Gateway
      group: gateway.networking.k8s.io
  # THE ALIAS LIST. One rule per alias, matched EXACTLY on `x-ai-eg-model` —
  # which the gateway fills in from the request body's `model` field before
  # routing. `modelNameOverride` is what actually goes upstream, so the caller
  # says the alias and the engine sees its own model id.
  #
  # AN UNKNOWN ALIAS MATCHES NO RULE AND GETS 404 (verified 2026-09-04), which is
  # what every other engine's names do here — correctly, one engine at a time.
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-e4b
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/gemma-4-E4B-it-qat-GGUF
      timeouts:
        request: 60m
    # LMSTUDIO'S OWN FILE, not an Unsloth upload: Studio lists LMStudio's models folder too, and
    # this is the one Gemma 4 12B on disk — the same Q4_0 `lms-gemma4-12b` loads.
    # ../../litellm/config/unsloth.yaml has the reasoning.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-12b
      backendRefs:
        - name: unsloth
          modelNameOverride: lmstudio-community/gemma-4-12B-it-QAT-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-26b
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
      timeouts:
        request: 60m
    # THE FAST ROUTE: the 26B above with thinking OFF — the same file, so switching swaps
    # nothing. Each Unsloth route obeys a different field, so both are set: `enable_thinking`
    # on chat and /v1/messages, `chat_template_kwargs` on /v1/responses. `set` OVERWRITES the
    # caller's own field, so here no body turns thinking back on. LiteLLM's copy stores the
    # same pair in `extra_body`; ../../litellm/config/unsloth.yaml has the measurements.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-26b-fast
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
          bodyMutation:
            set:
              - path: enable_thinking
                value: "false"
              - path: chat_template_kwargs
                value: '{"enable_thinking": false}'
      timeouts:
        request: 60m
    # THE Q8 GGUF, NOT THE MLX BUILD `lms-qwen38-27b` RUNS, and this file is the reason. PINNED
    # with `:UD-Q8_K_XL` since 2026-10-02: the repo also holds a Q4, which a bare name loads.
    # Unsloth serves POST /v1/messages for GGUF models only: with the MLX build loaded, the
    # `-anthropic` twin below answered 503 "No GGUF model loaded. Load a GGUF model first.",
    # and so did 8888 with no gateway in the path. The GGUF answers it with a thinking block
    # (both 2026-09-29). ../../litellm/config/unsloth.yaml carries the same build.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-qwen38-27b
      backendRefs:
        - name: unsloth
          modelNameOverride: unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-nomic-embed
      backendRefs:
        - name: unsloth
          modelNameOverride: second-state/Nomic-embed-text-v1.5-Embedding-GGUF
      timeouts:
        request: 60m
    # Studio's own embedder, run beside the chat model — evicts nothing while it is the
    # `Settings -> embedding model`. Not interchangeable with the GGUF above.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-nomic-embed-sidecar
      backendRefs:
        - name: unsloth
          modelNameOverride: nomic-ai/nomic-embed-text-v1.5
      timeouts:
        request: 60m
    # ── The `-anthropic` aliases: PASS-THROUGH, not translation ──────────────
    #
    # THESE EXIST FOR CLAUDE CODE, AND ONLY AN AGENT NEEDS THEM. The plain
    # aliases above reach `unsloth`, whose schema is `OpenAI`, so a call to
    # /anthropic/v1/messages is TRANSLATED Anthropic -> OpenAI on the way in. That
    # translation carries text, images, tool_use and tool_result — and it passes
    # `thinking` blocks STRAIGHT INTO the OpenAI body, where an OpenAI `content`
    # part may only be `text` or `image_url`. Envoy builds those blocks itself,
    # out of the engine's `reasoning_content`.
    #
    # So a one-shot call works and an agent turn cannot: Claude Code sends the
    # assistant's previous reply back on turn two, thinking block and all, and
    # the ENGINE answers
    #     400 messages.N.content.str: Input should be a valid string
    # which reads like "content must be a string" and means "no branch of the
    # content union matched".
    #
    # IT IS NOT THE GATEWAY'S BUG. The identical error comes back from Unsloth on
    # port 8888 with no gateway in the path at all, and from LMStudio and Ollama
    # too — measured 2026-09-04. It was INTERMITTENT, about 1 run in 5, because
    # the engine emits `reasoning_content` on some replies and not others.
    #
    # These rules reach `unsloth-anthropic` instead, whose schema is `Anthropic`,
    # so the body goes upstream UNTRANSLATED. Unsloth speaks Anthropic Messages
    # natively on /v1/messages and accepts both the thinking blocks and
    # `thinking: {"type": "adaptive"}` that Claude Code sends — verified against
    # the engine directly on 2026-09-04, before this was configured.
    #
    # A SECOND ALIAS IS THE ONLY WAY TO SAY IT. An AIGatewayRoute rule matches on
    # HEADERS ALONE (`AIGatewayRouteRuleMatch` has no path field), and the header
    # it matches is the body's `model`. So the protocol has to be chosen by the
    # name the caller asks for. `modelNameOverride` sends the engine its own id
    # either way, so the two aliases are one model on one engine.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-26b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-qwen38-27b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-e4b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/gemma-4-E4B-it-qat-GGUF
      timeouts:
        request: 60m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-12b-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: lmstudio-community/gemma-4-12B-it-QAT-GGUF
      timeouts:
        request: 60m
    # The fast route for Claude Code: the same two fields as `unsloth-gemma4-26b-fast`.
    # `enable_thinking` is the one /v1/messages obeys, and it wins over the
    # `thinking: {"type": "adaptive"}` Claude Code sends.
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: unsloth-gemma4-26b-fast-anthropic
      backendRefs:
        - name: unsloth-anthropic
          modelNameOverride: unsloth/gemma-4-26B-A4B-it-qat-GGUF
          bodyMutation:
            set:
              - path: enable_thinking
                value: "false"
              - path: chat_template_kwargs
                value: '{"enable_thinking": false}'
      timeouts:
        request: 60m
  # What lands in the access log above. Without these the token fields are empty.
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_reasoning_token
      type: ReasoningToken
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unsloth
  namespace: default
spec:
  endpoints:
    # Unsloth Studio runs NATIVELY on the host for the GPU and binds 127.0.0.1 only.
    #
    # HOSTNAME AND PORT ARE SEPARATE FIELDS HERE, which is why this project has
    # no equivalent of ../../litellm's *_API_BASE: there is no URL to put in one
    # variable. Change the port here.
    - fqdn:
        hostname: host.docker.internal
        port: 8888
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: unsloth
  namespace: default
spec:
  timeouts:
    # The per-BACKEND ceiling, separate from the per-ROUTE one above. Both have
    # to be raised: whichever is smaller wins, and upstream's default here is 3m.
    request: 60m
  schema:
    # `OpenAI` is a PROTOCOL, not a company. `prefix` defaults to /v1.
    name: OpenAI
  backendRef:
    name: unsloth
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
# THE SAME ENGINE, ADDRESSED IN ITS OWN PROTOCOL.
#
# One `Backend` — the endpoint above — can carry several `AIServiceBackend`s, and
# the schema is what each one MEANS by the bytes it forwards. This one says
# `Anthropic`, so /anthropic/v1/messages goes upstream as it arrived, and the
# `-anthropic` aliases in the route above are what select it.
#
# THE POINT IS WHAT DOES NOT HAPPEN HERE. No translation means no field can be
# dropped in translation, which is the whole reason Claude Code could not hold a
# conversation through the OpenAI-schema backend — see the long note on those
# rules. Unsloth serves /v1/messages itself, so there is nothing to bridge.
#
# It needs no `prefix`: Anthropic's own paths already start /v1.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: unsloth-anthropic
  namespace: default
spec:
  timeouts:
    request: 60m
  schema:
    name: Anthropic
  backendRef:
    name: unsloth
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client-buffer-limit
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigw-run
  connection:
    # ENVOY'S DEFAULT IS 32 KiB AND THAT IS TOO SMALL FOR AI TRAFFIC. A base64
    # image or a long agent transcript exceeds it and the request fails before
    # it reaches the model.
    bufferLimit: 50Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: unsloth-apikey
  namespace: default
type: Opaque
stringData:
  # From the shell. Unsloth 401s every route without it.
  apiKey: ${UNSLOTH_API_KEY}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: unsloth-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: unsloth
    # BOTH BACKENDS, or the `-anthropic` aliases 401 on every call. The policy
    # attaches to an AIServiceBackend and not to the `Backend` they share, so a
    # second backend over the same endpoint needs naming here too.
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: unsloth-anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: unsloth-apikey
---
# =============================================================================
# THE MCP SERVERS BEHIND THIS GATEWAY — /mcp on 26000. A TOOL SERVER IS NOT AN
# ENGINE, so this same block closes EVERY file in this directory: the six engine
# files, all.yaml and the personal lukas.yaml. `aigw run` reads one file and
# Envoy has no `include:`, so a copy in each is the only way /mcp answers
# whatever GATEWAY_ENGINE says. Keep the copies identical — `tail` two files
# and compare.
#
# A caller connects to ONE endpoint and gets the tools of every backend below,
# each renamed `<backend>__<tool>`. It never learns where a server runs, so
# moving one changes nothing that calls the gateway.
#
# NOTHING CHECKS THE CALLER, the same as on the LLM routes: anything that
# reaches 26000 can list and call these tools. `securityPolicy.apiKeyAuth` on
# the MCPRoute is the lever when a server with real side effects goes here. It
# is not set, because the test server's two tools return fixed strings.
#
# `bench-hardware` IS THE TEST SERVER, AND IT RUNS ONLY WHILE A TEST RUNS: each
# agent folder in ../tests starts its own `mcp_server.py --http 26090` for one
# scenario and stops it after. 26090 and not LiteLLM's 24090, so both suites
# can run at the same time.
#
# SO /mcp ANSWERS 500 BETWEEN TEST RUNS, and that is correct. With no backend
# up, `initialize` gets `failed to create MCP session to any backend` (measured
# 2026-10-07). LiteLLM answers at the same moment with an empty tool list.
#
# NOT `--mcp-config`. aigw reads that flag ONLY when no config file is given
# (cmd/aigw/config.go, `readConfig`), and compose always passes one, so the flag
# would be ignored without an error. An MCPRoute in this file is read by the
# same code path as the AIGatewayRoutes above (cmd/aigw/translate.go,
# `case "MCPRoute"`).
#
# GUARDED BY: ../tests/4_deepagents/08_gateway_mcp.py and the same scenario in
# folders 3, 5, 6 and 7. Delete this block and every one of them goes red.
# =============================================================================
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: aigw-run-mcp
  namespace: default
spec:
  parentRefs:
    - name: aigw-run
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
  backendRefs:
    # The backend's NAME is the tool prefix, and a Kubernetes name allows no
    # underscore — hence `bench-hardware`, where LiteLLM says `bench_hardware`.
    - name: bench-hardware
      kind: Backend
      group: gateway.envoyproxy.io
      path: /mcp
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: bench-hardware
  namespace: default
spec:
  endpoints:
    # The test server binds 127.0.0.1 on the HOST. compose.yml maps
    # host.docker.internal to the host gateway, as it does for the engines.
    - fqdn:
        hostname: host.docker.internal
        port: 26090
