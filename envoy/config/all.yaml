apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter
  namespace: default
spec:
  endpoints:
    # OpenRouter, over the public internet. TLS, so a BackendTLSPolicy below.
    #
    # HOSTNAME AND PORT ARE SEPARATE FIELDS HERE, which is why this project has
    # no equivalent of ../../litellm's *_API_BASE: there is no URL to put in one
    # variable. Change the port here.
    - fqdn:
        hostname: openrouter.ai
        port: 443
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter
  namespace: default
spec:
  timeouts:
    # The per-BACKEND ceiling, separate from the per-ROUTE one above. Both have
    # to be raised: whichever is smaller wins, and upstream's default here is 3m.
    request: 10m
  schema:
    # `OpenAI` is a PROTOCOL, not a company. `prefix` defaults to /v1.
    name: OpenAI
    # The backend serves the OpenAI API under this path, not at the root.
    prefix: /api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openrouter-anthropic
  namespace: default
spec:
  timeouts:
    request: 10m
  schema:
    # ONE `Backend` CARRIES BOTH OF THESE. The schema is what each one MEANS by the
    # bytes it forwards: `Anthropic` here, so /anthropic/v1/messages goes upstream as
    # it arrived and OpenRouter's own Anthropic skin answers it.
    name: Anthropic
    # Same as the OpenAI one — OpenRouter serves its APIs under /api/v1, not at the
    # root, so /api/v1/messages is where this lands.
    prefix: /api/v1
  backendRef:
    name: openrouter
    kind: Backend
    group: gateway.envoyproxy.io
    namespace: default
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: openrouter-tls
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: openrouter
  validation:
    # WITHOUT THIS the connection is plain HTTP to port 443 and every call fails
    # with an upstream connect error. The three local engines need no such policy.
    wellKnownCACertificates: "System"
    hostname: openrouter.ai
---
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-apikey
  namespace: default
type: Opaque
stringData:
  # From the shell. REAL SPEND.
  apiKey: ${OPENROUTER_API_KEY}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openrouter-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openrouter
    # THE SECOND BACKEND NEEDS THE KEY TOO. Miss this and the `-anthropic` alias
    # reaches OpenRouter with no Authorization header and gets 401, while the plain
    # alias beside it works — which reads as a broken alias, not a missing target.
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openrouter-anthropic
  type: APIKey
  apiKey:
    secretRef:
      name: openrouter-apikey

