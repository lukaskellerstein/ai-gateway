[project]
name = "envoy-tests"
version = "0.1.0"
description = "The runner that drives every folder here against the Envoy gateway"
readme = "README.md"
requires-python = ">=3.12"
# EMPTY, AND IT MUST STAY EMPTY. This project exists only so `uv run run_all.py`
# works from this directory. The runner shells out to `uv run --directory <folder>`
# for each folder, and every real dependency lives in that folder's own
# pyproject.toml — see README.md § Seven folders, seven projects.
dependencies = []

[tool.uv]
package = false
