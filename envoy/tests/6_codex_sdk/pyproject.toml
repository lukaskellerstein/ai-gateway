[project]
name = "envoy-tests-codex-sdk"
version = "0.1.0"
description = "OpenAI's Codex SDK pointed at the Envoy gateway"
readme = "README.md"
requires-python = ">=3.12"
# `openai-codex` ships its own pinned `codex` runtime as a dependency, so unlike
# the Claude Agent SDK this folder needs nothing from npm — `uv sync` is enough.
dependencies = [
    "openai-codex>=0.147.0",
    # The MCP server 04 spawns is written against `MCPServer`, the mcp 2.x API —
    # the same dialect as folder 5. This folder has no adapter capping it, so it
    # runs the newest.
    "mcp>=2.1.1",
]

[tool.uv]
package = false
