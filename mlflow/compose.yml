# =============================================================================
# MLflow AI Gateway — a STANDALONE compose project. http://localhost:25000.
# Works with both `podman compose up -d` and `docker compose up -d`.
#
# Run it from THIS directory. Nothing above it is read, and nothing here reads
# ../litellm or ../envoy. That is the whole point: delete a sibling folder and
# this keeps working.
#
#   cd mlflow && podman compose up -d
#
# Call it exactly like any OpenAI endpoint, with one URL changed and NO KEY:
#   POST http://localhost:25000/gateway/mlflow/v1/chat/completions
#   {"model": "lms-4b", "messages": [...], "max_tokens": 2048}
#
# TWO WORDS IN ./.env DECIDE WHAT THIS SERVES:
#
#   GATEWAY_ENGINE     lms | unsloth | ollama | openrouter | openai   default lms
#   GATEWAY_DISCOVERY  (empty) | on                                   default EMPTY
#
# THERE IS NO COMPOSE_PROFILES ANY MORE. Before the split one variable chose which
# gateway ran; now the DIRECTORY is that choice.
#
# EACH GATEWAY IS ITS OWN PROJECT AND ITS OWN .env, so this one can serve `ollama`
# while ../litellm serves `lms`. That is now allowed, and nothing checks that the
# same alias answers on both.
#
# WHAT MLFLOW HAS NO PLACE FOR, so it is absent rather than lost: prices,
# per-route `max_tokens`, context windows, per-route timeouts, virtual keys, spend
# logs, budget ceilings and /v1/messages. Its endpoints are database rows. The one
# that bites a caller is `max_tokens` — SEND IT YOURSELF on every request here.
# =============================================================================

# Distinct from ../litellm's `ai-gateway`, so both can run at once and the
# containers stay distinguishable: `ai-gateway-mlflow-<service>-N`.
name: ai-gateway-mlflow

services:
  # ---------------------------------------------------------------------------
  # Postgres — MLflow's own store: endpoints, encrypted provider secrets, traces.
  #
  # THIS IS A SECOND POSTGRES, not the one ../litellm runs. Before the split one
  # server carried both databases and postgres/init-databases.sh created the
  # second, because POSTGRES_DB takes exactly one name. Standalone projects cannot
  # share a container, so each now runs its own and creates its one database with
  # POSTGRES_DB — the init script is deleted.
  #
  # ITS VOLUME IS `ai-gateway-mlflow_postgres_data` and it started empty at the
  # split. Nothing of value was lost: mlflow-seed rebuilds every endpoint and
  # rewrites every secret on each `up -d`, and this gateway stored no traces worth
  # keeping (litellm's `success_callback` has always been empty).
  #
  # NO PUBLISHED HOST PORT: only mlflow connects, over the compose network.
  # For a shell: `podman compose exec postgres psql -U postgres -d mlflow`.
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlflow
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlflow"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # MLflow — the tracking server IS the gateway. There is no second process, and a
  # config change needs no restart. That is also why it cannot be configured by a
  # file: its endpoints live in the database and arrive over an API, which is what
  # mlflow-seed below is for.
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    command:
      - mlflow
      - server
      # A SQL backend is required: the gateway cannot run on a file store at all.
      - --backend-store-uri
      - postgresql://postgres:postgres@postgres:5432/mlflow
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlartifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "25000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    extra_hosts:
      # THE SERVER dials the engine, not the caller — so the local aliases resolve
      # host.containers.internal inside THIS container.
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    environment:
      # MLflow 3.x rejects an unknown Host header with 403 "Invalid Host header -
      # possible DNS rebinding attack detected". Requests from the host pass by
      # default; a caller inside the compose network addressing `mlflow:5000` does
      # not, and 0.0.0.0:5000 is the SERVER CALLING ITSELF, which is easy to miss
      # because nobody configures it. Only /health and /version are exempt, so the
      # container looks perfectly healthy while every in-stack call is refused.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,localhost:25000,127.0.0.1:5000,127.0.0.1:25000,0.0.0.0:5000"
      # MLflow has ONE global timeout and defaults to 300 s. Prompt processing on
      # this machine measures ~100 tok/s, so an agent-scale prompt needs 5-15
      # MINUTES before its first token — at 300 s the gateway gives up mid-prompt.
      MLFLOW_GATEWAY_ROUTE_TIMEOUT_SECONDS: "3600"
      # Wraps the key that encrypts the stored provider credentials. Blank is
      # supported: MLflow then uses a built-in passphrase and says so in the log.
      # Set it and NEVER change it — the existing secrets stop decrypting, and it
      # surfaces as an auth error at CALL time, not at startup. The repair is
      # `up -d`, because mlflow-seed rewrites every secret on each run.
      MLFLOW_CRYPTO_KEK_PASSPHRASE: ${MLFLOW_CRYPTO_KEK_PASSPHRASE:-}
    healthcheck:
      # /health is one of the two routes exempt from the Host header check above.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot runs the MLflow schema migrations against an empty database.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # mlflow-seed — writes this gateway's endpoint list in over the API, then exits.
  #
  # A CONTAINER THAT EXITS 0 IS THE FINISHED STATE. `compose logs mlflow-seed` is
  # the record of what it built. It runs on every `up -d` and is idempotent.
  #
  # THIS GATEWAY'S ALIAS LIST IS PYTHON, NOT YAML, because MLflow's gateway has no
  # config file. config/ carries one self-contained file per engine, and seed.py
  # loads the ONE that GATEWAY_ENGINE names:
  #   config/{lms,unsloth,ollama}.py    3 endpoints each      free
  #   config/openrouter.py              1 endpoint            PAID
  #   config/openai.py                  2 endpoints           PAID
  # They import config/gateway.py, which holds the API calls, so the whole
  # directory is mounted rather than a single file.
  #
  # THE WORD ARRIVES AS AN ENVIRONMENT VARIABLE, not in a filename. That is what
  # lets seed.py validate it and print the five allowed values, instead of failing
  # with `python: can't open file`.
  #
  # THE DISCOVERY MODULE HERE IS THIS PROJECT'S OWN COPY, trimmed to the probing
  # half — MLflow has no config file to render, so ../litellm's copy carries a
  # renderer this one does not need. The engine probes are duplicated between them
  # on purpose: each folder is a standalone project, and a shared module would be
  # a file neither one could delete. Fix a probe here and fix it there too.
  # ---------------------------------------------------------------------------
  mlflow-seed:
    image: ghcr.io/mlflow/mlflow:latest
    restart: "no"
    depends_on:
      mlflow: { condition: service_healthy }
    command: ["python", "/app/config/seed.py"]
    volumes:
      - ./config:/app/config:ro
      # Read-only, and importable only because of PYTHONPATH below: this container
      # writes no config file, because MLflow has none.
      - ./discover:/app/discover:ro
    extra_hosts:
      # LOAD-BEARING SINCE DISCOVERY. This container used to talk to nothing but
      # the MLflow server; with GATEWAY_DISCOVERY set it dials the engine on the
      # host to ask what it holds, exactly as the server does.
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # /app/discover ALONE, never /app. Before the split the mount landed on
      # /app/mlflow, and a PYTHONPATH of /app would have let Python import that
      # directory as a namespace package called `mlflow`, shadowing the real
      # library gateway.py imports. The mount is /app/config now, so the name
      # collision is gone — but the narrow path stays, because it costs nothing.
      PYTHONPATH: /app/discover
      # Empty by default: the hand-written config/<engine>.py is then the whole
      # list, which is what a fresh clone gets. Set it and every model the engine
      # holds is ADDED to that list. Discovery is LOCAL-ONLY — `openrouter` and
      # `openai` are refused by name, because money is never discovered.
      GATEWAY_DISCOVERY: ${GATEWAY_DISCOVERY:-}
      # WHICH ENDPOINTS THIS RUN WRITES. One engine at a time; seed.py rejects a
      # list and rejects a typo, by name.
      GATEWAY_ENGINE: ${GATEWAY_ENGINE:-lms}
      # This container never calls a provider; it reads these and hands them to
      # MLflow, which stores them encrypted. A NAME MISSING HERE IS THE SILENT
      # FAILURE: the seed skips that endpoint with "no API key in the environment"
      # and MLflow never gets it, so the alias 404s on 25000 for no visible reason.
      LM_STUDIO_API_BASE: ${LM_STUDIO_API_BASE:-http://host.containers.internal:1234/v1}
      UNSLOTH_API_BASE: ${UNSLOTH_API_BASE:-http://host.containers.internal:8888/v1}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.containers.internal:11434/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

volumes:
  postgres_data:
  mlflow_artifacts:
